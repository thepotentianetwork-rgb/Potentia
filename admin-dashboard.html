<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — ShedPro</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="shedpro-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Syncopate:wght@400;700&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin-shell.css">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
.sec-label{font-family:var(--mono);font-size:9.5px;letter-spacing:.34em;color:var(--silver);opacity:.75;text-transform:uppercase;margin-bottom:6px}

/* ── hero ─────────────────────────────────────────────────────────────── */
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:22px}
h2{font-family:var(--serif);font-size:44px;font-weight:300;color:var(--bright);line-height:1.02;letter-spacing:-.01em}
.lede{font-family:var(--serif);font-size:18px;color:var(--silver);margin-top:4px;font-weight:300}
.pulse{display:flex;gap:0;border:1px solid var(--dim);background:var(--deep)}
.pulse span{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--silver);padding:10px 14px;border-left:1px solid var(--dim);white-space:nowrap}
.pulse span:first-child{border-left:none}
.pulse b{color:var(--bright);font-weight:500;margin-right:6px}
.pulse .warm b{color:var(--sp-orange)}

/* ── KPI ribbon: one instrument, four readings ───────────────────────── */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--dim);background:linear-gradient(180deg,var(--panel-2),var(--deep));margin-bottom:var(--gap)}
.kpi{position:relative;padding:18px 22px 16px;display:flex;flex-direction:column;gap:12px;text-decoration:none;color:inherit;border-left:1px solid var(--dim);min-width:0;transition:background .15s}
.kpi:first-child{border-left:none}
.kpi::before{content:"";position:absolute;left:0;right:0;top:-1px;height:2px;background:var(--sp-blue);opacity:.55}
.kpi.warm::before{background:var(--sp-orange)}
.kpi.good::before{background:var(--sp-green)}
a.kpi:hover{background:rgba(44,192,253,.05)}
.kl{font-family:var(--mono);font-size:9.5px;letter-spacing:.22em;color:var(--silver);text-transform:uppercase}
.krow{display:flex;align-items:flex-end;justify-content:space-between;gap:14px}
.kv{font-family:var(--mono);font-size:34px;font-weight:300;color:var(--bright);line-height:1;letter-spacing:-.02em}
.kn{font-family:var(--mono);font-size:11px;color:var(--silver);margin-top:6px}
.kpi.good .kv{color:var(--sp-green)}
.spark{display:flex;align-items:flex-end;gap:2px;height:30px;flex:0 0 auto}
.spark i{display:block;width:3px;min-height:2px;background:var(--sp-blue);opacity:.35}
.spark i.has{opacity:1}
.kpi.warm .spark i{background:var(--sp-orange)}
.kpi.good .spark i{background:var(--sp-green)}

/* ── layout ───────────────────────────────────────────────────────────── */
.grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:var(--gap);align-items:start}
.stack{display:flex;flex-direction:column;gap:var(--gap);min-width:0}
.cols{display:flex;flex-direction:column;gap:var(--gap);min-width:0}
.panel{border:1px solid var(--dim);background:var(--deep);padding:18px 20px;min-width:0}
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--hair)}
.ptitle{font-family:var(--serif);font-size:23px;font-weight:300;color:var(--bright);line-height:1.1}
.ptitle[data-count]::after{content:attr(data-count);font-family:var(--mono);font-size:11px;color:var(--silver);margin-left:10px;vertical-align:middle}
.pmore{font-family:var(--mono);font-size:9.5px;letter-spacing:.15em;color:var(--sp-blue);text-decoration:none;text-transform:uppercase;white-space:nowrap}
.pmore:hover{color:var(--bright)}

/* ── installs: a timeline, not a card wall ───────────────────────────── */
.week{display:flex;flex-direction:column}
.day{display:grid;grid-template-columns:96px minmax(0,1fr) auto auto;align-items:center;gap:16px;padding:10px 0;border-bottom:1px solid var(--hair);text-decoration:none;color:inherit}
.day:last-child{border-bottom:none}
.day:hover .day-name{color:var(--sp-blue)}
.day.is-done{opacity:.55}
.day-top{display:contents}
.day-when{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--silver);text-transform:uppercase;line-height:1.6;grid-column:1;grid-row:1}
.day-when b{display:block;color:var(--bright);font-weight:500}
.day-shot{grid-column:3;grid-row:1;width:72px;height:46px;object-fit:cover;display:block;background:#0d0d16;border:1px solid var(--dim)}
.day-body{grid-column:2;grid-row:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.day-name{font-family:var(--serif);font-size:19px;color:var(--bright);font-weight:300;line-height:1.2;transition:color .15s}
.day-sub{font-family:var(--mono);font-size:10px;color:var(--silver);line-height:1.6;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.day-tag{grid-column:4;grid-row:1;font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;padding:6px 10px;text-align:center;font-weight:500;color:var(--black);min-width:92px}
.tag-prep,.tag-pour,.tag-gravel,.tag-concrete{background:var(--sp-orange)}
.tag-materials{background:var(--sp-violet)}
.tag-shop{background:var(--sp-blue)}
.tag-shed{background:var(--sp-green)}
.tag-done{background:none;color:var(--sp-green);border:1px solid var(--sp-green)}

/* ── rows ─────────────────────────────────────────────────────────────── */
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--hair)}
.row:last-child{border-bottom:none}
.row-bar{width:2px;align-self:stretch;min-height:30px;background:var(--sp-blue);flex:0 0 2px}
.row-bar.warm{background:var(--sp-orange)}
.row-bar.good{background:var(--sp-green)}
.row-shot{width:44px;height:34px;flex:0 0 44px;object-fit:cover;background:#0d0d16;border:1px solid var(--dim)}
.row-main{flex:1;min-width:0}
.row-name{font-family:var(--serif);font-size:17px;color:var(--bright);font-weight:300;line-height:1.3;text-decoration:none;display:block}
a.row-name:hover{color:var(--sp-blue)}
.row-sub{font-family:var(--mono);font-size:10px;color:var(--silver);line-height:1.6;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-when{font-family:var(--mono);font-size:10px;color:var(--silver);white-space:nowrap}
.row-when.late{color:var(--sp-orange)}
.row-act{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--sp-blue);text-decoration:none;border:1px solid rgba(44,192,253,.4);padding:6px 10px;white-space:nowrap}
.row-act:hover{background:rgba(44,192,253,.12)}
.row-act.off{color:var(--dim);border-color:var(--dim);pointer-events:none}
.chip{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--dim);color:var(--silver);padding:4px 7px;white-space:nowrap}
.chip.warm{color:var(--sp-orange);border-color:rgba(246,148,31,.5)}

/* ── quick links ──────────────────────────────────────────────────────── */
.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--dim);border:1px solid var(--dim)}
.quick a{background:var(--deep);padding:13px 14px;text-decoration:none;display:flex;flex-direction:column;gap:3px}
.quick a:hover{background:var(--panel-2)}
.quick b{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--bright);font-weight:400}
.quick span{font-family:var(--mono);font-size:9.5px;color:var(--silver)}

.empty{font-family:var(--mono);font-size:11px;color:var(--silver);opacity:.6;padding:18px 0;line-height:1.9}
.state{font-family:var(--mono);font-size:12px;color:var(--silver);padding:70px 0;line-height:2}

@media (max-width:1200px){
  .grid{grid-template-columns:minmax(0,1fr)}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi:nth-child(3){border-left:none}
  .kpi:nth-child(n+3){border-top:1px solid var(--dim)}
}
@media (max-width:760px){
  h2{font-size:32px}
  .lede{font-size:16px}
  .pulse{width:100%;flex-wrap:wrap}
  .pulse span{flex:1 1 45%;border-left:none;border-top:1px solid var(--dim)}
  .kpi{padding:14px 14px}
  .kv{font-size:26px}
  .krow{flex-wrap:wrap;gap:8px}
  .spark{height:24px}
  .cols{grid-template-columns:minmax(0,1fr)}
  .panel{padding:15px 14px}
  .day{grid-template-columns:minmax(0,1fr) auto;gap:6px 10px}
  .day-when{grid-column:1;grid-row:1;display:flex;gap:9px;align-items:baseline}
  .day-when b{display:inline}
  .day-shot{grid-column:2;grid-row:1/3;width:64px;height:44px}
  .day-body{grid-column:1;grid-row:2}
  .day-tag{grid-column:1/3;grid-row:3}
  .row{flex-wrap:wrap;row-gap:6px}
  .row-main{flex:1 1 150px}
  .row-act{min-height:40px;display:inline-flex;align-items:center}
  .quick{grid-template-columns:repeat(2,minmax(0,1fr))}
}
</style>
</head>
<body class="admin-shell">

<header class="shell">
  <a class="h-brand" href="admin-dashboard.html">
    <img src="shedpro-logo.png" alt="ShedPro">
    <span class="h-brand-text">
      <span class="h-title">SHEDPRO</span>
      <span class="h-sub">Command &middot; by Potentia</span>
    </span>
  </a>
  <nav class="shell-tabs" aria-label="Admin"></nav>
  <div class="h-actions">
    <span class="h-date" id="h-date"></span>
    <button class="logout" id="logout-btn">Log Out</button>
  </div>
</header>

<main class="shell-main">
  <div class="hero">
    <div>
      <p class="sec-label">ShedPro Partner</p>
      <h2 id="greeting">Dashboard</h2>
      <p class="lede">Jobs on site, leads to call, and what&rsquo;s next.</p>
    </div>
    <div class="pulse" id="pulse"></div>
  </div>
  <div id="content"><div class="state" id="state">Loading&hellip;</div></div>
</main>

<script src="admin-nav.js"></script>
<script src="admin-shell.js"></script>
<script src="admin-voice.js"></script>
<script>
var API_BASE = "https://potentia-assistant.thepotentianetwork.workers.dev";
var token = localStorage.getItem('potentia_admin_token');
var selfUrl = 'admin-dashboard.html';
if (!token) window.location.href = 'admin-login.html';

document.getElementById('logout-btn').addEventListener('click', function () {
  /* Revoke server-side too; keepalive so the redirect doesn't cancel it. */
  try { var t = localStorage.getItem('potentia_admin_token'); if (t) fetch(API_BASE + '/admin/logout', { method: 'POST', keepalive: true, headers: { 'Authorization': 'Bearer ' + t } }).catch(function () {}); } catch (e) {}
  localStorage.removeItem('potentia_admin_token');
  window.location.href = 'admin-login.html';
});

function authFetch(path, options) {
  options = options || {};
  options.headers = Object.assign({}, options.headers, { 'Authorization': 'Bearer ' + token });
  return fetch(API_BASE + path, options).then(function (res) {
    if (res.status === 401) {
      localStorage.removeItem('potentia_admin_token');
      window.location.href = 'admin-login.html?next=' + encodeURIComponent(selfUrl);
      throw new Error('Session expired');
    }
    return res.json().then(function (data) { return { ok: res.ok, data: data }; });
  });
}

function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function usd(n) {
  if (n == null || !isFinite(n)) return '$0';
  return '$' + Math.round(Number(n)).toLocaleString('en-US');
}

/* TODAY, AS THE BROWSER SEES IT. The worker runs in UTC and this shop does not,
   so the day is computed here and sent with the request — otherwise "today" is
   tomorrow for the whole evening. */
function todayISO() {
  var d = new Date();
  var p = function (x) { return (x < 10 ? '0' : '') + x; };
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}

/* A YYYY-MM-DD read as a calendar day. new Date('2026-10-15') is midnight UTC,
   which is the previous evening here — the same trap as the customer tracker. */
function dayParts(iso) {
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso || ''));
  if (!m) return null;
  var d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
  return isNaN(d.getTime()) ? null : d;
}
function dayShort(iso) {
  var d = dayParts(iso);
  if (!d) return '';
  return d.toLocaleDateString(undefined, { weekday: 'short' }).toUpperCase();
}
function dayNum(iso) {
  var d = dayParts(iso);
  if (!d) return '';
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }).toUpperCase();
}
/* "Today"/"Tomorrow" beat a date somebody has to work out. */
function dayWhen(iso, today) {
  var a = dayParts(iso), b = dayParts(today);
  if (!a || !b) return dayShort(iso);
  var diff = Math.round((a - b) / 86400000);
  if (diff === 0) return 'TODAY';
  if (diff === 1) return 'TOMORROW';
  return dayShort(iso);
}

function greetingFor(d) {
  var h = d.getHours();
  /* Said out loud at the right time of day or not at all — a dashboard that
     says good morning at four in the afternoon looks broken. */
  if (h < 12) return 'Good morning.';
  if (h < 18) return 'Good afternoon.';
  return 'Good evening.';
}

/* ── the four figures ───────────────────────────────────────────────────── */

function sparkline(series) {
  var box = el('div', 'spark');
  var vals = (series || []).slice(-31);
  if (!vals.length) return box;
  var max = Math.max.apply(null, vals.concat([1]));
  vals.forEach(function (v) {
    var bar = el('i', v > 0 ? 'has' : '');
    bar.style.height = Math.max(2, Math.round((v / max) * 34)) + 'px';
    box.appendChild(bar);
  });
  return box;
}

function kpi(opts) {
  var card = el(opts.href ? 'a' : 'div', 'kpi' + (opts.tone ? ' ' + opts.tone : ''));
  if (opts.href) card.href = opts.href;
  card.appendChild(el('div', 'kl', opts.label));
  var row = el('div', 'krow');
  var left = el('div');
  left.appendChild(el('div', 'kv', String(opts.value)));
  if (opts.note) left.appendChild(el('div', 'kn', opts.note));
  row.appendChild(left);
  if (opts.series) row.appendChild(sparkline(opts.series));
  card.appendChild(row);
  return card;
}

/* ── the week ───────────────────────────────────────────────────────────── */

function dayCard(w, today) {
  var card = el('a', 'day' + (w.done ? ' is-done' : ''));
  card.href = 'admin-customer.html?id=' + w.customer_id;

  var top = el('div', 'day-top');
  var when = el('div', 'day-when');
  when.appendChild(el('b', '', dayWhen(w.install_date, today)));
  when.appendChild(document.createTextNode(dayNum(w.install_date)));
  top.appendChild(when);
  /* Only ever the customer's own render. An order with none gets no picture
     rather than a shed that is not theirs. */
  if (w.image) {
    var shot = el('img', 'day-shot');
    shot.src = w.image;
    shot.alt = '';
    shot.loading = 'lazy';
    /* A dead R2 link would otherwise leave a broken-image icon on the job.
       Hidden rather than removed: it takes up no space either way, and the
       element staying put is what lets a test see which picture was chosen. */
    shot.onerror = function () { shot.style.display = 'none'; shot.setAttribute('data-failed', '1'); };
    top.appendChild(shot);
  }
  card.appendChild(top);

  var body = el('div', 'day-body');
  body.appendChild(el('div', 'day-name', w.customer_name || 'Unnamed customer'));
  if (w.summary) body.appendChild(el('div', 'day-sub', w.summary));
  if (w.city) body.appendChild(el('div', 'day-sub', w.city));
  card.appendChild(body);

  card.appendChild(el('div', 'day-tag ' + (w.done ? 'tag-done' : 'tag-' + w.item),
    w.done ? '✓ ' + w.label : w.label));
  return card;
}

/* ── the three lists ────────────────────────────────────────────────────── */

function fillOrEmpty(box, rows, emptyText) {
  if (!rows.length) { box.appendChild(el('div', 'empty', emptyText)); return box; }
  rows.forEach(function (r) { box.appendChild(r); });
  return box;
}

function followRow(f) {
  var row = el('div', 'row');
  row.appendChild(el('div', 'row-bar' + (f.urgent ? ' warm' : '')));
  var main = el('div', 'row-main');
  var name = el('a', 'row-name', f.name);
  name.href = 'admin-customer.html?id=' + f.customer_id;
  main.appendChild(name);
  main.appendChild(el('div', 'row-sub', f.reason));
  row.appendChild(main);
  row.appendChild(el('div', 'row-when' + (f.urgent ? ' late' : ''), f.ago || ''));
  /* Google Voice, so the call goes out on the business line rather than from
     whatever SIM the phone in your hand has. A number Voice cannot dial is
     shown as "No #" rather than as a button that does nothing. */
  var call = el('a', 'row-act', 'Call');
  if (!AdminVoice.attach(call, f.phone, 'call')) {
    call.className = 'row-act off';
    call.textContent = 'No #';
    call.title = f.phone ? 'That number cannot be dialled: ' + f.phone
                         : 'No phone number on file.';
  }
  row.appendChild(call);
  return row;
}

function readyRow(r) {
  var row = el('div', 'row');
  row.appendChild(el('div', 'row-bar'));
  if (r.image) {
    var shot = el('img', 'row-shot');
    shot.src = r.image; shot.alt = ''; shot.loading = 'lazy';
    shot.onerror = function () { shot.style.display = 'none'; shot.setAttribute('data-failed', '1'); };
    row.appendChild(shot);
  }
  var main = el('div', 'row-main');
  var name = el('a', 'row-name', r.customer_name);
  name.href = 'admin-customer.html?id=' + r.customer_id;
  main.appendChild(name);
  main.appendChild(el('div', 'row-sub', [r.summary, usd(r.amount)].filter(Boolean).join(' · ')));
  row.appendChild(main);
  /* Straight to the planner on their order, which is where a date gets set. */
  var go = el('a', 'row-act', 'Schedule');
  go.href = 'admin-customer.html?id=' + r.customer_id;
  row.appendChild(go);
  return row;
}

function payRow(p) {
  var row = el('div', 'row');
  row.appendChild(el('div', 'row-bar' + (p.sent_days != null && p.sent_days >= 7 ? ' warm' : '')));
  var main = el('div', 'row-main');
  var name = el('a', 'row-name', p.customer_name);
  name.href = 'admin-customer.html?id=' + p.customer_id;
  main.appendChild(name);
  main.appendChild(el('div', 'row-sub',
    [p.kind === 'deposit' ? 'Deposit' : p.kind === 'phase' ? 'Phase' : 'Balance', usd(p.amount)].join(' · ')));
  row.appendChild(main);
  /* SENT, not overdue. Nothing records payment terms, so the honest word is
     how long it has been out. */
  if (p.sent_days != null) {
    row.appendChild(el('div', 'chip' + (p.sent_days >= 7 ? ' warm' : ''),
      p.sent_days === 0 ? 'today' : p.sent_days + 'd out'));
  }
  var view = el('a', 'row-act' + (p.hosted_url ? '' : ' off'), 'View');
  if (p.hosted_url) { view.href = p.hosted_url; view.target = '_blank'; view.rel = 'noopener'; }
  row.appendChild(view);
  return row;
}

/* ── putting it together ────────────────────────────────────────────────── */

function panel(title, eyebrow, moreHref, moreLabel, count) {
  var box = el('div', 'panel');
  var head = el('div', 'phead');
  var left = el('div');
  left.appendChild(el('p', 'sec-label', eyebrow));
  var t = el('div', 'ptitle', title);
  if (count != null) t.setAttribute('data-count', String(count));
  left.appendChild(t);
  head.appendChild(left);
  if (moreHref) {
    var more = el('a', 'pmore', moreLabel + ' →');
    more.href = moreHref;
    head.appendChild(more);
  }
  box.appendChild(head);
  return box;
}

function pulse(d) {
  var box = document.getElementById('pulse');
  if (!box) return;
  box.textContent = '';
  var k = d.kpis || {};
  var open = (d.week || []).filter(function (w) { return !w.done; }).length;
  var calls = (d.followUps || []).length;
  var urgent = (d.followUps || []).filter(function (f) { return f.urgent; }).length;
  [[open, 'on site this week'], [calls, 'to call', urgent > 0], [usd((k.unpaid || {}).amount), 'outstanding']]
    .forEach(function (p) {
      var s = el('span', p[2] ? 'warm' : '');
      s.appendChild(el('b', '', String(p[0])));
      s.appendChild(document.createTextNode(p[1]));
      box.appendChild(s);
    });
}

var QUICK = [
  ['admin.html', 'Customers', 'Leads & orders'],
  ['admin-schedule.html', 'Schedule', 'Install calendar'],
  ['admin-activity.html', 'Activity', 'Invoices & events'],
  ['admin-data.html', 'Data', 'Won / lost trends'],
  ['admin-website.html', 'Website', 'Traffic & leads'],
  ['admin-pricing.html', 'Pricing', 'Price book']
];

function render(d) {
  var wrap = document.getElementById('content');
  wrap.textContent = '';
  pulse(d);

  var k = d.kpis || {};
  var kpis = el('div', 'kpis');
  kpis.appendChild(kpi({ label: 'New Leads', value: (k.newLeads || {}).count || 0,
    note: 'this month', series: (k.newLeads || {}).series, tone: 'warm',
    href: 'admin.html' }));
  kpis.appendChild(kpi({ label: 'Jobs Won', value: (k.won || {}).count || 0,
    note: usd((k.won || {}).amount), series: (k.won || {}).series, tone: 'good',
    href: 'admin-data.html' }));
  kpis.appendChild(kpi({ label: 'Awaiting Schedule', value: (k.awaiting || {}).count || 0,
    note: usd((k.awaiting || {}).amount), href: 'admin-schedule.html' }));
  kpis.appendChild(kpi({ label: 'Unpaid Invoices', value: (k.unpaid || {}).count || 0,
    note: usd((k.unpaid || {}).amount), href: 'admin-activity.html' }));
  wrap.appendChild(kpis);

  var grid = el('div', 'grid');
  var left = el('div', 'stack');
  var right = el('div', 'stack');

  var week = panel('Upcoming Installs', 'This week', 'admin-schedule.html', 'Full schedule', (d.week || []).length);
  var strip = el('div', 'week');
  (d.week || []).forEach(function (w) { strip.appendChild(dayCard(w, d.today)); });
  week.appendChild((d.week || []).length ? strip
    : el('div', 'empty', 'Nothing booked in the next seven days.'));
  left.appendChild(week);

  var qp = panel('Go to', 'Quick links');
  var q = el('div', 'quick');
  QUICK.forEach(function (x) {
    var a = el('a'); a.href = x[0];
    a.appendChild(el('b', '', x[1])); a.appendChild(el('span', '', x[2]));
    q.appendChild(a);
  });
  qp.appendChild(q);
  left.appendChild(qp);

  /* The action queue: everything with a button on it, in one column. */
  var cols = el('div', 'cols');
  var follow = panel('Follow Ups', 'Needs attention', 'admin.html', 'View all', (d.followUps || []).length);
  fillOrEmpty(follow, (d.followUps || []).map(followRow), 'Nobody is waiting on a call. Good.');
  cols.appendChild(follow);
  var ready = panel('Ready to Schedule', 'Sold, no date yet', 'admin-schedule.html', 'View all', (d.ready || []).length);
  fillOrEmpty(ready, (d.ready || []).map(readyRow), 'Every sold job has a date on it.');
  cols.appendChild(ready);
  var pay = panel('Payments Due', 'Unpaid invoices', 'admin-activity.html', 'View all', (d.payments || []).length);
  fillOrEmpty(pay, (d.payments || []).map(payRow), 'Nothing outstanding.');
  cols.appendChild(pay);
  right = cols;

  grid.appendChild(left);
  grid.appendChild(right);
  wrap.appendChild(grid);
}

function load() {
  var now = new Date();
  document.getElementById('greeting').textContent = greetingFor(now);

  authFetch('/admin/dashboard?today=' + encodeURIComponent(todayISO())).then(function (res) {
    if (!res.ok) throw new Error('load failed');
    render(res.data);
  }).catch(function (e) {
    if (/Session expired/.test(String(e && e.message))) return;
    var wrap = document.getElementById('content');
    wrap.textContent = '';
    wrap.appendChild(el('div', 'state', 'Could not load the dashboard. Refresh to try again.'));
  });
}

load();

AdminShell.mount();
</script>
</body>
</html>
