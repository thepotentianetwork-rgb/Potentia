<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Website — ShedPro</title>
<link rel="icon" href="shedpro-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Syncopate:wght@400;700&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin-shell.css">
<!-- Website traffic from GA4 (G-GR8BG7DXZE) via GET /api/analytics/overview. Never shows sample numbers. -->
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
.sec-label{font-family:var(--mono);font-size:9.5px;letter-spacing:.34em;color:var(--silver);opacity:.75;text-transform:uppercase;margin-bottom:6px}
h2{font-family:var(--serif);font-size:44px;font-weight:300;color:var(--bright);line-height:1.02}
.lede{font-family:var(--serif);font-size:18px;color:var(--silver);margin:4px 0 26px;font-weight:300}
.note{max-width:620px;border:1px solid var(--dim);background:var(--deep);padding:20px 22px;font-family:var(--serif);font-size:17px;line-height:1.55;color:var(--silver)}
.note b{color:var(--bright);font-weight:400}
.note .st{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;opacity:.7;margin-top:12px}
.stats{display:flex;gap:28px;flex-wrap:wrap;font-family:var(--mono);color:var(--silver);font-size:12px;letter-spacing:.08em}
.stats b{display:block;font-family:var(--serif);font-size:30px;font-weight:300;color:var(--bright);letter-spacing:0}
.blocks{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;max-width:1000px}
.blk{border:1px solid var(--dim);background:var(--deep);padding:20px 22px}
.blk h3{font-family:var(--serif);font-weight:400;font-size:21px;color:var(--bright);margin-bottom:10px}
.big{font-family:var(--serif);font-size:40px;font-weight:300;color:var(--bright);line-height:1}
.big small{font-size:16px;color:var(--silver);margin-left:6px}
.say{font-family:var(--serif);font-size:16.5px;line-height:1.5;color:var(--silver);margin-top:8px}
.say b{color:var(--bright);font-weight:400}
.tip{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;color:var(--silver);opacity:.7;margin-top:12px;line-height:1.5}
.bar{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:16px;color:var(--silver);margin:7px 0}
.bar span.n{min-width:150px}.bar i{flex:1;height:6px;background:var(--dim);position:relative}
.bar i em{position:absolute;left:0;top:0;bottom:0;background:var(--silver)}
.bar b{font-family:var(--mono);font-size:12px;font-weight:400;min-width:44px;text-align:right;color:var(--bright)}
.foot{font-family:var(--mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;opacity:.55;margin-top:22px;color:var(--silver)}
</style>
</head>
<body class="admin-shell">
<header class="shell">
  <a class="h-brand" href="admin-dashboard.html">
    <img src="shedpro-logo.png" alt="ShedPro">
    <span class="h-brand-text"><span class="h-title">SHEDPRO</span><span class="h-sub">Command &middot; by Potentia</span></span>
  </a>
  <nav class="shell-tabs" aria-label="Admin"></nav>
  <div class="h-actions"><span class="h-date" id="h-date"></span><button class="logout" id="logout-btn">Log Out</button></div>
</header>
<main class="shell-main">
  <p class="sec-label">Website</p>
  <h2>Website traffic</h2>
  <p class="lede">shedpro-utah.com &middot; Google Analytics, last 28 days</p>
  <div id="body"><div class="note">Checking&hellip;</div></div>
</main>
<script src="admin-nav.js"></script>
<script src="admin-shell.js"></script>
<script>
AdminShell.mount();

var API_BASE = "https://potentia-assistant.thepotentianetwork.workers.dev";
var token = localStorage.getItem('potentia_admin_token');
if (!token) window.location.href = 'admin-login.html';
document.getElementById('logout-btn').addEventListener('click', function () {
  try { if (token) fetch(API_BASE + '/admin/logout', { method: 'POST', keepalive: true, headers: { 'Authorization': 'Bearer ' + token } }).catch(function () {}); } catch (e) {}
  localStorage.removeItem('potentia_admin_token'); window.location.href = 'admin-login.html';
});
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
fetch('/api/analytics/overview?range=28d').then(function(r){return r.ok?r.json():{connected:false,reason:'http_'+r.status};})
.catch(function(){return {connected:false,reason:'unreachable'};})
.then(function(d){
  var el=document.getElementById('body');
  if(!d.connected||!d.kpis){
    el.innerHTML='<div class="note">Google Analytics isn&rsquo;t hooked up to this page yet. The site already sends visits to GA4 (<b>G-GR8BG7DXZE</b>); to show them here we still need the GA4 <b>Property ID</b> and a <b>Viewer</b> service account.<div class="st">Status: '+esc(d.reason||'not_configured')+'</div></div>';
    return;
  }
  var k=d.kpis,N=function(x){return Number(x||0).toLocaleString();};
  var mins=Math.floor(k.avgSessionSec/60),secs=k.avgSessionSec%60;
  var eng=Math.round((k.engagementRate||0)*100);
  var PAGE={'/':'Home page','/gallery':'Gallery (photos)','/contact':'Contact / quote form','/about':'About us','/faq':'FAQ','/blog':'Blog','/designer':'Shed designer'};
  function pname(p){var c=p.replace(/\.html$/,'').replace(/\/$/,'')||'/';return PAGE[c]||(c.indexOf('/blog-')===0?'Blog: '+c.slice(6).replace(/-/g,' '):c);}
  function bars(list,fmt){if(!list||!list.length)return '<p class="say">No data yet.</p>';var t=list.reduce(function(a,r){return a+r.value;},0)||1,m=list[0].value||1;
    return list.map(function(r){return '<div class="bar"><span class="n">'+esc(fmt?fmt(r.label):r.label)+'</span><i><em style="width:'+Math.round(r.value/m*100)+'%"></em></i><b>'+Math.round(r.value/t*100)+'%</b></div>';}).join('');}
  var DEV={mobile:'Phones',desktop:'Computers',tablet:'Tablets'};
  var mob=(d.devices||[]).filter(function(r){return r.label==='mobile';})[0],devT=(d.devices||[]).reduce(function(a,r){return a+r.value;},0)||1;
  var h='<div class="blocks">';
  h+='<div class="blk"><h3>People who visited the site</h3><div class="big">'+N(k.users)+'<small>people</small></div><p class="say">They came by <b>'+N(k.sessions)+'</b> times in total and looked at <b>'+N(k.pageViews)+'</b> pages. <b>'+N(k.newUsers)+'</b> of them were first-time visitors.</p><p class="tip">A &ldquo;visit&rdquo; is one sitting. One person can visit more than once.</p></div>';
  h+='<div class="blk"><h3>How long they stayed</h3><div class="big">'+mins+'m '+secs+'s<small>per visit</small></div><p class="say"><b>'+eng+'%</b> of visits were real interest &mdash; they stayed 10+ seconds, clicked around, or viewed 2+ pages. The rest left quickly.</p><p class="tip">Above ~50% real-interest visits is healthy for a local business site.</p></div>';
  h+='<div class="blk"><h3>Contacted us (leads)</h3><div class="big">'+N(k.leads)+'<small>form submissions</small></div><p class="say">People who filled out the contact / quote form on the website.'+(k.designerUsers!=null?' <b>'+N(k.designerUsers)+'</b> people opened the shed designer page.':'')+'</p><p class="tip">Compare with leads in the CRM &mdash; phone calls and texts aren&rsquo;t counted here.</p></div>';
  var dz=d.designer;
  if(dz){var de=dz.events||{},dc=function(n){return de[n]?de[n].count:0;},du=function(n){return de[n]?de[n].users:0;},anyEv=Object.keys(de).length>0;
    var rows=[['Picked a starting style','starter_chosen'],['Moved through design steps (style, size, roof, doors&hellip;)','step_viewed'],['Skipped an optional step','step_skipped'],['Opened the quote form','quote_form_opened'],['Sent a quote request from the designer','quote_submitted'],['Opened &ldquo;talk to us&rdquo;','consult_opened'],['Sent a consult request','consult_submitted'],['Shared their design','design_shared'],['Came back to a saved design','design_resumed'],['Saw an AI photo of their shed','ai_render_shown']];
    var tbl=anyEv?rows.map(function(r){return '<div class="bar"><span class="n">'+r[0]+'</span><b>'+N(dc(r[1]))+(du(r[1])?' <small>('+N(du(r[1]))+' people)</small>':'')+'</b></div>';}).join(''):'<p class="say">No designer clicks recorded yet. Tracking of what people do inside the designer started on <b>'+esc(dz.trackingSince)+'</b>, so earlier days show nothing &mdash; numbers will fill in from here.</p>';
    h+='<div class="blk"><h3>Shed designer</h3><div class="big">'+N(dz.users)+'<small>people opened it</small></div><p class="say">The 3D shed designer page was viewed <b>'+N(dz.pageViews)+'</b> times.</p>'+tbl+'<p class="tip">Designer tracking started '+esc(dz.trackingSince)+'. Before that the designer didn&rsquo;t report to Google Analytics, so older days read 0.</p></div>';}
  h+='<div class="blk"><h3>Where they came from</h3>'+bars(d.sources)+'<p class="tip">Share of visits. &ldquo;Typed the address&rdquo; often means word of mouth, a truck sign, or a business card.</p></div>';
  h+='<div class="blk"><h3>Pages they looked at</h3>'+bars(d.topPages,pname)+'<p class="tip">Share of page views among the top pages. If the gallery is popular, keep adding photos.</p></div>';
  h+='<div class="blk"><h3>Phone or computer</h3>'+bars(d.devices,function(l){return DEV[l]||l;})+'<p class="tip">'+(mob?Math.round(mob.value/devT*100)+'% browse on a phone &mdash; check how the site looks on yours.':'How people browse the site.')+'</p></div>';
  if(d.cities&&d.cities.length) h+='<div class="blk"><h3>Where they are</h3>'+bars(d.cities)+'<p class="tip">Approximate, based on internet connection. Out-of-state cities are often internet providers or bots, not customers.</p></div>';
  h+='</div><p class="foot">Last 28 days &middot; Google Analytics &middot; updated '+esc(new Date(d.fetchedAt).toLocaleString())+'</p>';
  el.innerHTML=h;
});
</script>
</body>
</html>
