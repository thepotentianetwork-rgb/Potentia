<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Website — ShedPro</title>
<link rel="icon" href="shedpro-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Syncopate:wght@400;700&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin-shell.css">
<!-- Website traffic from GA4 (G-GR8BG7DXZE) via GET /api/analytics/overview. Never shows sample numbers. -->
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
.sec-label{font-family:var(--mono);font-size:9.5px;letter-spacing:.34em;color:var(--silver);opacity:.75;text-transform:uppercase;margin-bottom:6px}
h2{font-family:var(--serif);font-size:44px;font-weight:300;color:var(--bright);line-height:1.02}
.lede{font-family:var(--serif);font-size:18px;color:var(--silver);margin:4px 0 26px;font-weight:300}
.note{max-width:620px;border:1px solid var(--dim);background:var(--deep);padding:20px 22px;font-family:var(--serif);font-size:17px;line-height:1.55;color:var(--silver)}
.note b{color:var(--bright);font-weight:400}
.note .st{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;opacity:.7;margin-top:12px}
.stats{display:flex;gap:28px;flex-wrap:wrap;font-family:var(--mono);color:var(--silver);font-size:12px;letter-spacing:.08em}
.stats b{display:block;font-family:var(--serif);font-size:30px;font-weight:300;color:var(--bright);letter-spacing:0}
</style>
</head>
<body class="admin-shell">
<header class="shell">
  <a class="h-brand" href="admin-dashboard.html">
    <img src="shedpro-logo.png" alt="ShedPro">
    <span class="h-brand-text"><span class="h-title">SHEDPRO</span><span class="h-sub">Command &middot; by Potentia</span></span>
  </a>
  <nav class="shell-tabs" aria-label="Admin"></nav>
  <div class="h-actions"><span class="h-date" id="h-date"></span><button class="logout" id="logout-btn">Log Out</button></div>
</header>
<main class="shell-main">
  <p class="sec-label">Website</p>
  <h2>Website traffic</h2>
  <p class="lede">shedpro-utah.com &middot; Google Analytics, last 28 days</p>
  <div id="body"><div class="note">Checking&hellip;</div></div>
</main>
<script src="admin-nav.js"></script>
<script src="admin-shell.js"></script>
<script>
var API_BASE = "https://potentia-assistant.thepotentianetwork.workers.dev";
var token = localStorage.getItem('potentia_admin_token');
if (!token) window.location.href = 'admin-login.html';
document.getElementById('logout-btn').addEventListener('click', function () {
  try { if (token) fetch(API_BASE + '/admin/logout', { method: 'POST', keepalive: true, headers: { 'Authorization': 'Bearer ' + token } }).catch(function () {}); } catch (e) {}
  localStorage.removeItem('potentia_admin_token'); window.location.href = 'admin-login.html';
});
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
fetch('/api/analytics/overview?range=28d').then(function(r){return r.ok?r.json():{connected:false,reason:'http_'+r.status};})
.catch(function(){return {connected:false,reason:'unreachable'};})
.then(function(d){
  var el=document.getElementById('body');
  if(!d.connected||!d.kpis){
    el.innerHTML='<div class="note">Google Analytics isn&rsquo;t hooked up to this page yet. The site already sends visits to GA4 (<b>G-GR8BG7DXZE</b>); to show them here we still need the GA4 <b>Property ID</b> and a <b>Viewer</b> service account.<div class="st">Status: '+esc(d.reason||'not_configured')+'</div></div>';
    return;
  }
  var k=d.kpis,rows=[['Sessions',k.sessions],['Users',k.users],['Leads',k.leads]].filter(function(r){return r[1]!=null;});
  el.innerHTML='<div class="stats">'+rows.map(function(r){return '<div><b>'+Number(r[1]).toLocaleString()+'</b>'+r[0]+'</div>';}).join('')+'</div>';
});
</script>
</body>
</html>
