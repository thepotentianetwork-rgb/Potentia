<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customer Login — ShedPro</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="shedpro-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Syncopate:wght@400;700&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --black:#040407;--deep:#08080f;--chrome:#c8cdd6;--silver:#8a909e;--bright:#e8ecf4;--dim:#2a2d38;
  --sp-blue:#2cc0fd;--sp-blue-deep:#1c8fc2;--sp-orange:#f6941f;
}
body{background:var(--black);color:var(--chrome);font-family:'Cormorant Garamond',serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  background-image:radial-gradient(circle at 15% 10%, rgba(44,192,253,0.07), transparent 45%), radial-gradient(circle at 85% 90%, rgba(246,148,31,0.05), transparent 45%);}
.card{width:100%;max-width:400px;border:1px solid var(--dim);padding:44px 40px;background:var(--deep);position:relative}
.card::before{content:'';position:absolute;top:-1px;left:-1px;right:-1px;height:2px;background:linear-gradient(90deg,var(--sp-blue),var(--sp-orange))}
.brand{display:flex;align-items:center;gap:14px;margin-bottom:32px}
.brand img{width:44px;height:44px;object-fit:contain}
.brand-text{display:flex;flex-direction:column;gap:3px}
.brand-name{font-family:'Syncopate',sans-serif;font-size:13px;letter-spacing:0.2em;color:var(--bright)}
.brand-sub{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:0.3em;color:var(--silver);text-transform:uppercase}
.label{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:0.3em;color:var(--sp-blue);text-transform:uppercase;margin-bottom:14px}
h1{font-size:30px;font-weight:300;color:var(--bright);margin-bottom:28px}
.form-group{margin-bottom:20px}
.form-group label{display:block;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:0.3em;color:var(--silver);text-transform:uppercase;margin-bottom:8px}
.form-group input{width:100%;background:rgba(255,255,255,0.03);border:1px solid var(--dim);color:var(--bright);font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:300;padding:13px 16px;outline:none;transition:border-color 0.3s}
.form-group input:focus{border-color:var(--sp-blue)}
.submit{width:100%;font-family:'DM Mono',monospace;font-size:12px;letter-spacing:0.2em;color:var(--black);background:var(--sp-blue);padding:15px;border:none;text-transform:uppercase;cursor:pointer;transition:background 0.3s;margin-top:8px;font-weight:700}
.submit:hover{background:#5ad0ff}
.submit:disabled{opacity:0.5;cursor:not-allowed}
.error{font-family:'DM Mono',monospace;font-size:11px;color:#e0684f;margin-top:16px;min-height:14px}
.footer-tag{margin-top:32px;padding-top:20px;border-top:1px solid var(--dim);font-family:'DM Mono',monospace;font-size:9px;letter-spacing:0.15em;color:var(--dim);text-transform:uppercase;text-align:center}

html{-webkit-text-size-adjust:100%}
body{min-height:100dvh;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));align-items:flex-start}
@media (min-height:640px){body{align-items:center}}
.card{padding:28px 22px}
h1{font-size:26px;line-height:1.15;margin-bottom:20px}
.brand{margin-bottom:24px;gap:10px}
.brand-name{font-size:12px;letter-spacing:0.14em}
.brand-sub{letter-spacing:0.16em;font-size:8px;line-height:1.35;max-width:14rem}
.form-group input{font-size:16px;padding:12px 14px}
.submit{padding:14px;letter-spacing:0.12em}
.intro{font-size:16px !important;line-height:1.35}
@media (max-width:380px){
  .card{padding:22px 16px}
  h1{font-size:24px}
  .brand img{width:36px;height:36px}
  .brand-sub{max-width:11rem}
}
</style>
</head>
<body>

<div class="card">
  <div class="brand">
    <img src="shedpro-logo.png" alt="ShedPro">
    <div class="brand-text">
      <span class="brand-name">SHEDPRO</span>
      <span class="brand-sub">Customer Portal</span>
    </div>
  </div>
  <p class="label">Your Shed Project</p>
  <h1>Customer Sign In</h1>
  <p class="intro" style="font-size:17px;color:var(--silver);margin:-16px 0 24px">Track your build, schedule and payments. Use the login ShedPro sent you.</p>
  <form id="login-form">
    <div class="form-group">
      <label for="login">Username or email</label>
      <input type="text" id="login" autocomplete="username" required>
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required autofocus>
    </div>
    <button type="submit" class="submit" id="submit-btn">Log In</button>
    <p class="error" id="error"></p>
  </form>
  <p style="margin-top:18px;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:0.15em;text-transform:uppercase"><a href="contact.html" style="color:var(--silver)">Questions? Contact ShedPro</a></p>
  <p class="footer-tag">Built &amp; managed by Potentia</p>
</div>

<script>
var API_BASE = "https://potentia-assistant.thepotentianetwork.workers.dev";
document.getElementById('login-form').addEventListener('submit', function (e) {
  e.preventDefault();
  var err = document.getElementById('error'), btn = document.getElementById('submit-btn');
  err.textContent = ''; btn.disabled = true;
  fetch(API_BASE + '/portal/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ portal: 'customer', login: document.getElementById('login').value, password: document.getElementById('password').value }) })
    .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, status: r.status, d: d }; }); })
    .then(function (r) {
      if (!r.ok) { err.textContent = r.status === 401 ? 'Incorrect username or password.' : (r.d.error || 'Something went wrong.'); btn.disabled = false; return; }
      localStorage.setItem('potentia_portal_token', r.d.token);
      location.href = 'portal-customer.html';
    })
    .catch(function () { err.textContent = 'Something went wrong — try again.'; btn.disabled = false; });
});
</script>
</body>
</html>
