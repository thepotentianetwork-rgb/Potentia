<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quote — ShedPro</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="shedpro-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Syncopate:wght@400;700&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --black:#040407;--deep:#08080f;--chrome:#c8cdd6;--silver:#8a909e;--bright:#e8ecf4;--dim:#2a2d38;
  --sp-blue:#2cc0fd;--sp-blue-deep:#1c8fc2;--sp-orange:#f6941f;
}
body{background:var(--black);color:var(--chrome);font-family:'Cormorant Garamond',serif;min-height:100vh;padding:40px 20px}

.toolbar{max-width:800px;margin:0 auto 20px;display:flex;justify-content:space-between}
.back-link{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:0.15em;color:var(--silver);text-decoration:none;text-transform:uppercase}
.back-link:hover{color:var(--bright)}
.print-btn{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:0.15em;color:var(--black);background:var(--sp-blue);border:none;padding:10px 20px;text-transform:uppercase;cursor:pointer;font-weight:700}
.print-btn:hover{background:#5ad0ff}

.doc{max-width:800px;margin:0 auto;background:var(--deep);border:1px solid var(--dim);padding:48px}
.doc::before{content:'';display:block;height:2px;background:linear-gradient(90deg,var(--sp-blue),var(--sp-orange));margin:-48px -48px 40px}

.doc-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:40px;flex-wrap:wrap;gap:20px}
.doc-brand{display:flex;align-items:center;gap:16px}
.doc-brand img{width:56px;height:56px;object-fit:contain}
.doc-brand-name{font-family:'Syncopate',sans-serif;font-size:16px;letter-spacing:0.15em;color:var(--bright)}
.doc-brand-contact{font-family:'DM Mono',monospace;font-size:11px;color:var(--silver);margin-top:6px;line-height:1.6}
.doc-meta{text-align:right;font-family:'DM Mono',monospace;font-size:11px;color:var(--silver);line-height:1.8}
.doc-meta strong{color:var(--bright)}

.doc-section{margin-bottom:32px}
.doc-label{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:0.3em;color:var(--dim);text-transform:uppercase;margin-bottom:14px;border-bottom:1px solid var(--dim);padding-bottom:8px}

.doc-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px 32px}
.doc-field .fl{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:0.15em;color:var(--dim);text-transform:uppercase;margin-bottom:4px}
.doc-field .fv{font-size:17px;color:var(--chrome);font-weight:300}

.price-box{background:rgba(44,192,253,0.06);border:1px solid var(--sp-blue-deep);padding:24px 28px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.price-label{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:0.15em;color:var(--silver);text-transform:uppercase}
.price-value{font-size:40px;color:var(--bright);font-weight:300}

.br-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--dim);font-size:15px}
.br-row:last-child{border-bottom:none}
.br-label{color:var(--chrome)}
.br-amt{color:var(--bright);font-family:'DM Mono',monospace;font-size:13px}
.spec-val{color:var(--chrome);font-family:'Cormorant Garamond',serif;font-size:15px}

.sub-label{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:0.15em;color:var(--dim);text-transform:uppercase;margin-bottom:6px}
.br-note{font-family:'Cormorant Garamond',serif;font-size:13px;color:var(--silver);margin-top:10px;line-height:1.5}

.design-link{display:inline-block;margin-top:14px;font-family:'DM Mono',monospace;font-size:12px;color:var(--sp-blue);text-decoration:none}
.design-link:hover{color:var(--bright)}

.doc-footer{margin-top:40px;padding-top:24px;border-top:1px solid var(--dim);font-family:'DM Mono',monospace;font-size:11px;color:var(--dim);line-height:1.8}

.empty{font-family:'DM Mono',monospace;font-size:12px;color:var(--dim)}

.render-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.render-cell{border:1px solid var(--dim);overflow:hidden}
.render-cell img{width:100%;display:block;aspect-ratio:4/3;object-fit:cover;background:#000}
.render-caption{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:0.1em;color:var(--silver);text-transform:uppercase;text-align:center;padding:6px 0}

.floorplan-wrap{text-align:center}
.floorplan-legend{display:flex;justify-content:center;gap:24px;margin-top:14px;font-family:'DM Mono',monospace;font-size:10px;color:var(--silver);text-transform:uppercase}
.legend-swatch{display:inline-block;width:14px;height:4px;margin-right:6px;vertical-align:middle}

@media print{
  body{background:#fff;color:#111;padding:0}
  .toolbar{display:none}
  .doc{border:none;background:#fff;max-width:100%}
  .doc-brand-name,.price-value,.doc-field .fv,.doc-meta strong,.br-amt,.spec-val{color:#111}
  .doc-brand-contact,.doc-meta,.doc-label,.doc-field .fl,.doc-footer,.render-caption,.floorplan-legend,.br-label,.sub-label,.br-note{color:#333}
  .price-box{background:#f5f9fc;border-color:#bcdcf0}
  .br-row{border-color:#ddd}
  .render-cell{border-color:#ccc}
  .render-grid{break-inside:avoid}
}
</style>
</head>
<body>

<div class="toolbar">
  <a href="#" class="back-link" id="back-link">← Back</a>
  <button class="print-btn" onclick="window.print()">Print / Save as PDF</button>
</div>

<div class="doc" id="doc">
  <p class="empty">Loading…</p>
</div>

<script>
var API_BASE = "https://potentia-assistant.thepotentianetwork.workers.dev";
var token = localStorage.getItem('potentia_admin_token');
var submissionId = new URLSearchParams(location.search).get('id');
var selfUrl = 'quote.html' + location.search;

if (!token) window.location.href = 'admin-login.html?next=' + encodeURIComponent(selfUrl);
if (!submissionId) document.getElementById('doc').innerHTML = '<p class="empty">No quote specified.</p>';

function authFetch(path) {
  return fetch(API_BASE + path, { headers: { 'Authorization': 'Bearer ' + token } }).then(function (res) {
    if (res.status === 401) {
      localStorage.removeItem('potentia_admin_token');
      window.location.href = 'admin-login.html?next=' + encodeURIComponent(selfUrl);
      throw new Error('Session expired');
    }
    return res.json().then(function (data) { return { ok: res.ok, data: data }; });
  });
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function field(label, value) {
  return '<div class="doc-field"><div class="fl">' + esc(label) + '</div><div class="fv">' + (value ? esc(value) : '—') + '</div></div>';
}
function money2(n) { return '$' + Math.round(n).toLocaleString(); }

// Utah sales tax — applied to the shed and to each separately-billed item
// (concrete, interior finishing) since each is invoiced as its own sale.
var TAX_RATE = 0.0725;
// Each item is invoiced as its own stage of work, and a 30% deposit is
// collected against that item's tax-included price when its stage starts.
var DEPOSIT_RATE = 0.30;
var PCT_LABEL = function (r) { return (r * 100).toFixed(2).replace(/\.?0+$/, ''); };

// Only the customer-facing SELL-side fields of the redline go here — never
// the cost/margin fields (framing, siding cost, trueTotalCost, profit, etc.)
// that live alongside them in the same object for the admin dashboard.
// Shared by buildBreakdown() and the price box so both show the same total.
function taxBreakdown(redline) {
  if (!redline || typeof redline !== 'object') return null;
  var num = function (n) { return Number(n) || 0; };
  function sumLines(lines, amtKey) {
    return (lines || []).reduce(function (t, l) { return t + num(l[amtKey]); }, 0);
  }

  // Everything about the shed itself (base, doors, windows, dormers, siding,
  // wall height, electrical, loft, shelves, add-ons) is rolled into one
  // "Shed" line. Only foundation and interior finishing are broken out.
  var shedTotal = num(redline.marginPrice)
    + sumLines(redline.doorUpLines, 'up')
    + sumLines(redline.windowSellLines, 'price')
    + sumLines(redline.dormerSellLines, 'price')
    + num(redline.sidingSell)
    + num(redline.heightSell)
    + num(redline.elecSell)
    + num(redline.loftSell)
    + sumLines(redline.shelfSellLines, 'price')
    + sumLines(redline.addonLines, 'amt');

  // Build order matches how the job is actually run and billed: concrete
  // goes in first, then the shed, then interior finishing — always in
  // this order, each its own phase.
  var rows = [];
  function add(phase, label, amt) { if (label && amt) rows.push({ phase: phase, label: 'Phase ' + phase + ' — ' + label, amt: Number(amt) }); }
  add(1, redline.foundName || 'Concrete', redline.foundSell);
  add(2, 'Shed' + (redline.baseSheetLabel ? ' (' + redline.baseSheetLabel + ')' : ''), shedTotal);
  add(3, redline.intSellName || 'Interior Finishing', redline.intSell);

  if (!rows.length) return null;
  rows.forEach(function (r) {
    r.tax = r.amt * TAX_RATE;
    r.total = r.amt + r.tax;
    r.deposit = r.total * DEPOSIT_RATE;
  });
  var subtotal = rows.reduce(function (t, r) { return t + r.amt; }, 0);
  var tax = subtotal * TAX_RATE;
  var depositTotal = rows.reduce(function (t, r) { return t + r.deposit; }, 0);
  return { rows: rows, subtotal: subtotal, tax: tax, total: subtotal + tax, depositTotal: depositTotal };
}

function buildBreakdown(bd) {
  if (!bd) return '';
  var rowsHtml = bd.rows.map(function (r) {
    return '<div class="br-row"><span class="br-label">' + esc(r.label) + '</span>'
      + '<span class="br-amt">' + money2(r.amt) + '</span></div>';
  }).join('');
  rowsHtml += '<div class="br-row"><span class="br-label">Subtotal</span><span class="br-amt">' + money2(bd.subtotal) + '</span></div>';
  rowsHtml += '<div class="br-row"><span class="br-label">Sales Tax (' + PCT_LABEL(TAX_RATE) + '%)</span><span class="br-amt">' + money2(bd.tax) + '</span></div>';

  var depositRowsHtml = bd.rows.map(function (r) {
    return '<div class="br-row"><span class="br-label">Phase ' + r.phase + ' Deposit (' + PCT_LABEL(DEPOSIT_RATE) + '%)</span>'
      + '<span class="br-amt">' + money2(r.deposit) + '</span></div>';
  }).join('');
  depositRowsHtml += '<div class="br-row"><span class="br-label">Total Deposit Due</span><span class="br-amt">' + money2(bd.depositTotal) + '</span></div>';

  return '<div class="doc-section"><div class="doc-label">Price Breakdown</div>' + rowsHtml + '</div>'
    + '<div class="doc-section"><div class="doc-label">Deposits Due</div>' + depositRowsHtml
    +   '<div class="br-note">Each item is invoiced separately as its stage of work begins — a 30% deposit (tax included) is collected per item, with the balance due on completion.</div>'
    + '</div>';
}

// Mirrors the door naming used to price it in the designer (same width
// breakpoints and style keys) so the spec list reads the same way the quote
// was actually priced, without needing the designer's pricing engine here.
var DOOR_STYLE_NAMES = { basic: 'Standard', craftsman: 'Craftsman', xtrim: 'X-Trim', arch: 'Arch Trim', panel4: '4-Panel' };
var DOOR_RESID_NAMES = {
  res6: '36" Residential 6-Panel', reshalf: '36" Residential Half Lite', resfull: '36" Residential Full Lite',
  res6B: '36" Residential 6-Panel (Black)', reshalfB: '36" Residential Half Lite (Black)', resfullB: '36" Residential Full Lite (Black)'
};
function doorLabel(dd) {
  var w = dd.w || 60, st = dd.style || 'basic';
  if (st === 'rollup') {
    var gl = (w <= 76) ? "6'" : (w <= 90) ? "7'" : "8'";
    return gl + ' Roll-Up Garage Door';
  }
  if (st === 'cedar') {
    var cl = (w <= 64) ? "5'" : (w <= 78) ? "6'" : (w <= 90) ? "7'" : "8'";
    return cl + ' Cedar Double Door';
  }
  if (st === 'fairytale') return 'Fairytale Entry Door';
  if (DOOR_RESID_NAMES[st]) return DOOR_RESID_NAMES[st];
  var wl = (w <= 38) ? "3'" : (w <= 46) ? '3\'6"' : (w <= 64) ? "5'" : (w <= 78) ? "6'" : "7'";
  var kind = (w <= 46) ? 'Single' : 'Double';
  return wl + ' ' + kind + ' — ' + (DOOR_STYLE_NAMES[st] || st);
}
function wallLabel(w) { return w ? w.charAt(0).toUpperCase() + w.slice(1) : '—'; }

function buildSpecs(config) {
  var doors = Array.isArray(config.doors) ? config.doors : [];
  var windows = Array.isArray(config.windows) ? config.windows : [];
  if (!doors.length && !windows.length) return '';

  function rows(items, labelFn) {
    return items.map(function (it) {
      return '<div class="br-row"><span class="br-label">' + esc(wallLabel(it.wall)) + '</span>'
        + '<span class="spec-val">' + esc(labelFn(it)) + '</span></div>';
    }).join('');
  }

  var html = '<div class="doc-section"><div class="doc-label">Doors &amp; Windows</div>';
  if (doors.length) {
    html += '<div class="sub-label">Doors</div>' + rows(doors, doorLabel);
  }
  if (windows.length) {
    html += '<div class="sub-label" style="margin-top:' + (doors.length ? '18px' : '0') + '">Windows</div>'
      + rows(windows, function (wd) { return wd.type || 'Window'; });
  }
  html += '</div>';
  return html;
}

function render(submission, customer) {
  var details = {};
  try { details = JSON.parse(submission.details) || {}; } catch (e) {}
  var config = (details.config && typeof details.config === 'object') ? details.config : {};

  if (customer) document.getElementById('back-link').href = 'admin-customer.html?id=' + encodeURIComponent(customer.id);

  var addressLine = [details.address, [details.city, details.state, details.zip].filter(Boolean).join(', ')]
    .filter(Boolean).join(', ');

  var fields = '';
  if (config.w && config.l) fields += field('Size', config.w + '’ x ' + config.l + '’' + (config.h ? ' x ' + config.h + '’ wall' : ''));
  if (config.style) fields += field('Style', config.style);
  if (config.siding) fields += field('Siding', config.siding);
  if (config.roofType) fields += field('Roof', config.roofType);
  if (Array.isArray(config.doors)) fields += field('Doors', config.doors.length);
  if (Array.isArray(config.windows)) fields += field('Windows', config.windows.length);
  if (config.foundation) fields += field('Foundation', config.foundation);
  if (config.loft) fields += field('Loft', config.loft);
  if (config.elec) fields += field('Electrical', config.elec);
  if (!fields) fields = '<p class="empty">No design details captured for this order.</p>';

  var safePermalink = null;
  if (typeof details.permalink === 'string' && /^https:\/\//i.test(details.permalink)) {
    safePermalink = details.permalink;
  }

  var breakdown = taxBreakdown(details.redline);
  var totalDue = breakdown ? breakdown.total
    : (details.quotedPrice != null && isFinite(Number(details.quotedPrice)) ? Number(details.quotedPrice) * (1 + TAX_RATE) : null);

  var html = ''
    + '<div class="doc-header">'
    +   '<div class="doc-brand">'
    +     '<img src="shedpro-logo.png" alt="ShedPro">'
    +     '<div>'
    +       '<div class="doc-brand-name">SHEDPRO</div>'
    +       '<div class="doc-brand-contact">435-232-9516<br>shedprollc.utah@gmail.com</div>'
    +     '</div>'
    +   '</div>'
    +   '<div class="doc-meta">'
    +     'Quote #' + esc(submission.id) + '<br>'
    +     esc(new Date(submission.created_at).toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' }))
    +   '</div>'
    + '</div>'

    + '<div class="doc-section">'
    +   '<div class="doc-label">Customer</div>'
    +   '<div class="doc-grid">'
    +     field('Name', submission.name)
    +     field('Email', submission.email)
    +     field('Phone', submission.phone)
    +     field('Address', addressLine)
    +   '</div>'
    + '</div>'

    + '<div class="doc-section">'
    +   '<div class="doc-label">Building Design</div>'
    +   '<div class="doc-grid">' + fields + '</div>'
    +   (safePermalink ? '<a class="design-link" href="' + esc(safePermalink) + '" target="_blank" rel="noopener">View this exact 3D design ↗</a>' : '')
    + '</div>'

    + buildSpecs(config)

    + '<div class="doc-section" id="renders-section"></div>'
    + '<div class="doc-section" id="floorplan-section"></div>'

    + buildBreakdown(breakdown)

    + '<div class="doc-section">'
    +   '<div class="price-box">'
    +     '<span class="price-label">Total Due (Tax Included)</span>'
    +     '<span class="price-value">' + (totalDue != null ? money2(totalDue) : 'Pending review') + '</span>'
    +   '</div>'
    + '</div>'

    + (details.notes ? '<div class="doc-section"><div class="doc-label">Customer Notes</div><div class="fv" style="font-size:15px">' + esc(details.notes) + '</div></div>' : '')

    + '<div class="doc-footer">'
    +   'Pricing is reviewed and confirmed by a ShedPro representative before order. Current promotions will be included in your final quote.<br>'
    +   'Questions? Call or text 435-232-9516, or email shedprollc.utah@gmail.com.'
    + '</div>';

  document.getElementById('doc').innerHTML = html;

  renderImages(details.renders, document.getElementById('renders-section'));
  renderFloorPlan(config, document.getElementById('floorplan-section'));
}

// ---- Building Images (from R2, if this order has captured renders) ----
function renderImages(renders, container) {
  if (!container || !renders || typeof renders !== 'object') return;
  var order = ['perspective', 'front', 'right', 'back', 'left'];
  var grid = document.createElement('div');
  grid.className = 'render-grid';
  var any = false;

  order.forEach(function (view) {
    var url = renders[view];
    if (typeof url !== 'string' || !/^https:\/\//i.test(url)) return;
    any = true;
    var cell = document.createElement('div');
    cell.className = 'render-cell';
    var img = document.createElement('img');
    img.src = url;
    img.alt = view;
    img.loading = 'lazy';
    var cap = document.createElement('div');
    cap.className = 'render-caption';
    cap.textContent = view.charAt(0).toUpperCase() + view.slice(1);
    cell.appendChild(img);
    cell.appendChild(cap);
    grid.appendChild(cell);
  });

  if (!any) return;
  var label = document.createElement('div');
  label.className = 'doc-label';
  label.textContent = 'Building Images';
  container.appendChild(label);
  container.appendChild(grid);
}

// ---- Floor Plan (drawn from door/window wall+position data we already capture) ----
var SVG_NS = 'http://www.w3.org/2000/svg';
function svgEl(tag, attrs) {
  var e = document.createElementNS(SVG_NS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

function buildFloorPlanSVG(config) {
  var w = Number(config.w), l = Number(config.l);
  if (!isFinite(w) || !isFinite(l) || w <= 0 || l <= 0 || w > 200 || l > 200) return null;

  var validWalls = ['front', 'back', 'left', 'right'];
  var pad = 46, scale = 22;
  var wPx = w * scale, lPx = l * scale;
  var svgW = wPx + pad * 2, svgH = lPx + pad * 2 + 20;

  var svg = svgEl('svg', { viewBox: '0 0 ' + svgW + ' ' + svgH, width: '100%' });
  svg.style.maxWidth = '380px';
  svg.style.display = 'block';
  svg.style.margin = '0 auto';

  svg.appendChild(svgEl('rect', { x: pad, y: pad, width: wPx, height: lPx, fill: 'none', stroke: '#8a909e', 'stroke-width': 2.5 }));

  function label(text, x, y, rotate) {
    var attrs = { x: x, y: y, 'font-family': 'DM Mono, monospace', 'font-size': '10px', fill: '#8a909e', 'text-anchor': 'middle' };
    if (rotate) attrs.transform = 'rotate(' + rotate + ' ' + x + ' ' + y + ')';
    var t = svgEl('text', attrs);
    t.textContent = text;
    svg.appendChild(t);
  }
  label('BACK', pad + wPx / 2, pad - 12);
  label('FRONT · ' + w + '’ x ' + l + '’', pad + wPx / 2, pad + lPx + 30);
  label('LEFT', pad - 26, pad + lPx / 2, -90);
  label('RIGHT', pad + wPx + 26, pad + lPx / 2, 90);

  function wallGeometry(wall) {
    if (wall === 'back') return { x1: pad, y1: pad, x2: pad + wPx, y2: pad, horiz: true };
    if (wall === 'front') return { x1: pad, y1: pad + lPx, x2: pad + wPx, y2: pad + lPx, horiz: true };
    if (wall === 'left') return { x1: pad, y1: pad, x2: pad, y2: pad + lPx, horiz: false };
    if (wall === 'right') return { x1: pad + wPx, y1: pad, x2: pad + wPx, y2: pad + lPx, horiz: false };
    return null;
  }

  function placeMarker(item, kind) {
    if (!item || typeof item !== 'object' || validWalls.indexOf(item.wall) === -1) return;
    var geo = wallGeometry(item.wall);
    if (!geo) return;
    var pos = Number(item.pos);
    if (!isFinite(pos)) pos = 0.5;
    pos = Math.max(0, Math.min(1, pos));
    var widthIn = Number(item.w);
    var widthFt = isFinite(widthIn) && widthIn > 0 ? Math.min(widthIn, 300) / 12 : (kind === 'door' ? 3 : 2);
    var markerPx = widthFt * scale;
    var color = kind === 'door' ? '#2cc0fd' : '#f6941f';

    if (geo.horiz) {
      var cx = geo.x1 + (geo.x2 - geo.x1) * pos;
      var x0 = Math.max(geo.x1, cx - markerPx / 2), x1 = Math.min(geo.x2, cx + markerPx / 2);
      svg.appendChild(svgEl('line', { x1: x0, y1: geo.y1, x2: x1, y2: geo.y1, stroke: color, 'stroke-width': 5 }));
    } else {
      var cy = geo.y1 + (geo.y2 - geo.y1) * pos;
      var y0 = Math.max(geo.y1, cy - markerPx / 2), y1v = Math.min(geo.y2, cy + markerPx / 2);
      svg.appendChild(svgEl('line', { x1: geo.x1, y1: y0, x2: geo.x1, y2: y1v, stroke: color, 'stroke-width': 5 }));
    }
  }

  (Array.isArray(config.windows) ? config.windows.slice(0, 40) : []).forEach(function (w) { placeMarker(w, 'window'); });
  (Array.isArray(config.doors) ? config.doors.slice(0, 10) : []).forEach(function (d) { placeMarker(d, 'door'); });

  return svg;
}

function renderFloorPlan(config, container) {
  if (!container) return;
  var svg = buildFloorPlanSVG(config);
  if (!svg) return;

  var label = document.createElement('div');
  label.className = 'doc-label';
  label.textContent = 'Floor Plan';
  container.appendChild(label);

  var wrap = document.createElement('div');
  wrap.className = 'floorplan-wrap';
  wrap.appendChild(svg);

  var legend = document.createElement('div');
  legend.className = 'floorplan-legend';
  legend.innerHTML =
    '<span><span class="legend-swatch" style="background:#2cc0fd"></span>Door</span>' +
    '<span><span class="legend-swatch" style="background:#f6941f"></span>Window</span>';
  wrap.appendChild(legend);

  container.appendChild(wrap);
}

if (token && submissionId) {
  authFetch('/admin/submissions/' + submissionId).then(function (r) {
    if (!r.ok) {
      document.getElementById('doc').innerHTML = '<p class="empty">Quote not found.</p>';
      return;
    }
    render(r.data.submission, r.data.customer);
  });
}
</script>
</body>
</html>
