<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — ShedPro</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="shedpro-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Syncopate:wght@400;700&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --black:#040407;--deep:#08080f;--chrome:#c8cdd6;--silver:#8a909e;--bright:#e8ecf4;--dim:#2a2d38;
  --sp-blue:#2cc0fd;--sp-blue-deep:#1c8fc2;--sp-orange:#f6941f;
}
body{background:var(--black);color:var(--chrome);font-family:'Cormorant Garamond',serif;min-height:100vh}

header{border-bottom:1px solid var(--dim);border-image:linear-gradient(90deg,var(--sp-blue),var(--sp-orange)) 1;padding:20px 40px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.h-brand{display:flex;align-items:center;gap:14px}
.h-brand img{width:34px;height:34px;object-fit:contain}
.h-brand-text{display:flex;flex-direction:column;gap:2px}
.h-title{font-family:'Syncopate',sans-serif;font-size:12px;letter-spacing:0.2em;color:var(--bright)}
.h-sub{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:0.2em;color:var(--silver);text-transform:uppercase}
.h-actions{display:flex;gap:20px;align-items:center}
.back-link{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:0.15em;color:var(--silver);text-decoration:none;text-transform:uppercase}
.back-link:hover{color:var(--sp-blue)}
.act-badge{display:inline-block;margin-left:6px;font-family:'DM Mono',monospace;font-size:9px;line-height:1;color:var(--black);background:var(--sp-orange);border-radius:20px;padding:3px 6px;vertical-align:top}
.logout{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:0.15em;color:var(--silver);text-transform:uppercase;background:none;border:1px solid var(--dim);padding:9px 18px;cursor:pointer;transition:all 0.3s}
.logout:hover{border-color:var(--sp-blue);color:var(--bright)}

main{max-width:1200px;margin:0 auto;padding:48px 40px 100px}
section{margin-bottom:64px}
.sec-label{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:0.4em;color:var(--dim);text-transform:uppercase;margin-bottom:8px}
h2{font-size:30px;font-weight:300;color:var(--bright);margin-bottom:24px}

table{width:100%;border-collapse:collapse}
th{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:0.15em;color:var(--dim);text-transform:uppercase;text-align:left;padding:10px 12px;border-bottom:1px solid var(--dim)}
td{padding:12px;border-bottom:1px solid var(--dim);font-size:15px;font-weight:300;vertical-align:top}
tr:hover td{background:rgba(255,255,255,0.02)}
.empty{font-family:'DM Mono',monospace;font-size:12px;color:var(--dim);padding:24px 12px}

select,input.cell{background:rgba(255,255,255,0.03);border:1px solid var(--dim);color:var(--bright);font-family:'DM Mono',monospace;font-size:12px;padding:7px 10px;outline:none}
select:focus,input.cell:focus{border-color:var(--sp-blue)}
input.cell{width:100%;font-family:'Cormorant Garamond',serif;font-size:15px}

.status-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:8px;flex-shrink:0}
.status-new{background:var(--sp-blue)}
.status-contacted,.status-quoted{background:var(--sp-orange)}
.status-won{background:#5fd08a}
.status-lost{background:var(--dim)}
/* The flex lives on an inner wrapper, never on the <td> itself. A table cell
   set to display:flex drops out of the table layout algorithm — it stops
   sharing the row's height, so its border-bottom draws at its own offset and
   the column visibly fails to line up with the others. */
.status-wrap{display:flex;align-items:center;gap:8px}
.status-wrap .status-dot{margin-right:0}

/* ---- follow-up temperature ---- */
.act-date{display:block;white-space:nowrap}
.act-ago{display:block;font-family:'DM Mono',monospace;font-size:10px;color:var(--dim);margin-top:3px}
.temp{display:inline-flex;align-items:center;gap:5px;font-family:'DM Mono',monospace;font-size:9px;letter-spacing:0.14em;text-transform:uppercase;padding:3px 9px;border-radius:20px;margin-top:7px;border:1px solid;white-space:nowrap}
.temp::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor;flex-shrink:0}
.temp-hot{color:#ff7a45;border-color:rgba(255,122,69,0.45);background:rgba(255,122,69,0.12)}
.temp-warm{color:var(--sp-orange);border-color:rgba(246,148,31,0.4);background:rgba(246,148,31,0.1)}
.temp-cold{color:var(--sp-blue);border-color:rgba(44,192,253,0.35);background:rgba(44,192,253,0.08)}
.temp-dormant{color:var(--silver);border-color:var(--dim);background:none}
/* A revisit date that has arrived outranks everything — it's the one state
   that means "act today". */
.temp-due{color:#5fd08a;border-color:rgba(95,208,138,0.5);background:rgba(95,208,138,0.14)}
/* Dashed edge = held by hand rather than computed from activity. */
.temp.pinned{border-style:dashed}
.revisit{display:block;font-family:'DM Mono',monospace;font-size:10px;color:var(--dim);margin-top:5px}

.note-cell{font-size:13px;color:var(--silver);max-width:220px}
.note-cell .note-time{display:block;font-family:'DM Mono',monospace;font-size:10px;color:var(--dim);margin-top:2px}
.view-link{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:0.1em;color:var(--sp-blue);text-decoration:none;text-transform:uppercase;white-space:nowrap}
.view-link:hover{color:var(--bright)}

tr.lead-new{background:linear-gradient(90deg,rgba(246,148,31,0.09),rgba(246,148,31,0.01) 55%)}
tr.lead-new:hover td{background:rgba(246,148,31,0.05)}
tr.lead-new td:first-child{box-shadow:inset 3px 0 0 var(--sp-orange)}
.name-cell{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.new-badge{display:inline-flex;align-items:center;gap:5px;font-family:'DM Mono',monospace;font-size:9px;letter-spacing:0.15em;color:var(--sp-orange);background:rgba(246,148,31,0.14);border:1px solid rgba(246,148,31,0.45);padding:3px 9px;border-radius:20px;text-transform:uppercase;animation:new-pulse 2s ease-in-out infinite}
.new-badge::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--sp-orange)}
/* Consult = they asked to talk before finishing a design. Blue rather than
   the orange New Lead pill so the two read as different things at a glance,
   and no pulse — both animating at once turns the row into a light show. */
.consult-badge{display:inline-flex;align-items:center;gap:5px;font-family:'DM Mono',monospace;font-size:9px;letter-spacing:0.15em;color:#5aa9e6;background:rgba(90,169,230,0.14);border:1px solid rgba(90,169,230,0.45);padding:3px 9px;border-radius:20px;text-transform:uppercase}
.consult-badge::before{content:'';width:5px;height:5px;border-radius:50%;background:#5aa9e6}
@keyframes new-pulse{
  0%,100%{box-shadow:0 0 0 0 rgba(246,148,31,0.4)}
  50%{box-shadow:0 0 0 5px rgba(246,148,31,0)}
}

.table-wrap{overflow-x:auto}
/* Search + shop-order button (13 Oct 2026). */
.cust-search{display:block;width:100%;box-sizing:border-box;font-size:17px;padding:14px 16px;margin:0 0 18px;background:transparent;color:var(--bright,#fff);border:2px solid var(--sp-blue,#29a8e0);border-radius:0;font-family:inherit}
.cust-search::placeholder{color:var(--dim)}
.search-count{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--dim);margin:-8px 0 14px;min-height:14px}
.shop-btn{display:inline-flex;align-items:center;gap:6px;min-height:40px;min-width:44px;padding:6px 10px;margin-left:8px;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:0.06em;text-transform:uppercase;color:var(--sp-blue,#29a8e0);background:transparent;border:1px solid var(--sp-blue,#29a8e0);cursor:pointer;text-decoration:none;vertical-align:middle;position:relative}
.shop-btn svg{width:18px;height:18px;flex:0 0 auto}
.shop-pick{position:absolute;z-index:20;top:100%;left:0;margin-top:4px;background:var(--black,#0b0b0b);border:1px solid var(--sp-blue,#29a8e0);min-width:200px;display:flex;flex-direction:column}
.shop-pick a{display:block;padding:14px 14px;min-height:44px;box-sizing:border-box;color:var(--bright,#fff);text-decoration:none;font-family:'DM Mono',monospace;font-size:12px;letter-spacing:0.05em;border-bottom:1px solid var(--dim)}
.shop-pick a:last-child{border-bottom:none}
/* iPad (Oct 2026). Between the phone cards (<=760) and the full desktop table
   (>=1200) the eight-column table was squeezed: phone numbers broke over
   three lines, the note column was a word wide and the table scrolled
   sideways in portrait. Tablet-only, so phone and desktop are untouched. */
@media (min-width:761px) and (max-width:1199px){
  header{padding:18px 28px}
  main{padding:40px 28px 90px}
  td{padding:14px 10px}
  th{padding-left:10px;padding-right:10px}
  td:nth-child(4){white-space:nowrap}
  td:nth-child(3){overflow-wrap:anywhere}
  select{min-height:40px}
}
@media (min-width:761px) and (max-width:1023px){
  .table-wrap{overflow-x:visible}
  table,thead,tbody,tr,td{display:block;width:auto}
  thead{display:none}
  tbody{display:flex;flex-direction:column;gap:12px}
  tbody tr{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr);gap:4px 18px;border:1px solid var(--dim);padding:14px 18px}
  tr.lead-new{border-color:rgba(246,148,31,0.45)}
  tr.lead-new td:first-child{box-shadow:none}
  tr:hover td{background:none}
  td{border-bottom:none;padding:6px 0;min-width:0}
  td::before{content:attr(data-label);display:block;font-family:'DM Mono',monospace;font-size:9px;letter-spacing:0.15em;color:var(--dim);text-transform:uppercase;margin-bottom:3px}
  td:nth-child(2){grid-column:1 / 3;grid-row:1}
  td:nth-child(1){grid-column:3;grid-row:1}
  td:nth-child(6){grid-column:1}
  td.note-cell{grid-column:2 / 4;max-width:none}
  td.view-cell{grid-column:1 / -1;padding-top:8px}
  td.view-cell:empty{display:none}
  td.view-cell::before{display:none}
  td.empty{grid-column:1 / -1}
  td.empty::before{display:none}
}
@media (max-width:760px){
  header{padding:16px 20px}
  .h-actions{gap:8px}
  main{padding:32px 18px 80px}
  h2{font-size:24px}
  .table-wrap{overflow-x:visible}
  table,thead,tbody,tr,td{display:block;width:100%}
  thead{display:none}
  tbody tr{border:1px solid var(--dim);padding:14px 16px;margin-bottom:14px}
  tr.lead-new{border-color:rgba(246,148,31,0.45)}
  tr.lead-new td:first-child{box-shadow:none}
  td{border-bottom:none;padding:6px 0}
  td::before{content:attr(data-label);display:block;font-family:'DM Mono',monospace;font-size:9px;letter-spacing:0.15em;color:var(--dim);text-transform:uppercase;margin-bottom:3px}
  td.view-cell{padding-top:12px}
  td.view-cell::before{display:none}
  td.view-cell .view-link{display:block;text-align:center;border:1px solid var(--dim);padding:10px;font-size:12px}
  .note-cell{max-width:none}
  td.empty{padding:10px 0}
  td.empty::before{display:none}
}

</style>
</head>
<body>

<header>
  <div class="h-brand">
    <img src="shedpro-logo.png" alt="ShedPro">
    <div class="h-brand-text">
      <span class="h-title">SHEDPRO ADMIN</span>
      <span class="h-sub">Built &amp; managed by Potentia</span>
    </div>
  </div>
  <div class="h-actions">
    <button class="logout" id="logout-btn">Log Out</button>
  </div>
</header>

<main>
  <section>
    <p class="sec-label">ShedPro Partner</p>
    <h2>Customers</h2>
    <input type="search" id="cust-search" class="cust-search" placeholder="Search name, email, phone, address or quote #" autocomplete="off" aria-label="Search customers">
    <div class="search-count" id="search-count"></div>
    <div class="table-wrap">
    <table>
      <thead>
        <tr><th>Last Activity</th><th>Name</th><th>Email</th><th>Phone</th><th>Latest Quote</th><th>Status</th><th>Latest Note</th><th></th></tr>
      </thead>
      <tbody id="customers-body">
        <tr><td class="empty" colspan="8">Loading…</td></tr>
      </tbody>
    </table>
    </div>
  </section>
</main>

<script src="admin-nav.js"></script>
<script src="admin-activity.js"></script>
<script src="admin-lost.js"></script>
<script>
var API_BASE = "https://potentia-assistant.thepotentianetwork.workers.dev";
var token = localStorage.getItem('potentia_admin_token');

if (!token) {
  window.location.href = 'admin-login.html';
}

function authFetch(path, options) {
  options = options || {};
  options.headers = Object.assign({}, options.headers, { 'Authorization': 'Bearer ' + token });
  return fetch(API_BASE + path, options).then(function (res) {
    if (res.status === 401) {
      localStorage.removeItem('potentia_admin_token');
      window.location.href = 'admin-login.html';
      throw new Error('Session expired');
    }
    return res.json().then(function (data) { return { ok: res.ok, data: data }; });
  });
}

document.getElementById('logout-btn').addEventListener('click', function () {
  localStorage.removeItem('potentia_admin_token');
  window.location.href = 'admin-login.html';
});


// ---- Customers ----
// ---- follow-up temperature ----
// Temperature answers "how warm is this customer", and the honest signal for
// that is how long they have been sitting on their quote. Nothing you do moves
// it: ringing someone does not make them keener, and five unanswered calls
// arguably make a lead colder, not hotter. An earlier version counted calls and
// notes as making a lead hot again, which meant the column measured how busy
// YOU had been and labelled it as how interested THEY were.
//
// Your activity is still worth seeing — it just belongs in its own line, below,
// where it says what it actually is.
function quoteAgeMs(c) {
  if (!c.latest_submission_at) return null;
  var t = new Date(c.latest_submission_at).getTime();
  return isNaN(t) ? null : t;
}

// The most recent time anyone reached out, from either the call log or a note.
// Reported as contact, never folded into the temperature.
function lastContactMs(c) {
  var times = [c.latest_note_at, c.latest_call_at]
    .filter(Boolean)
    .map(function (t) { return new Date(t).getTime(); })
    .filter(function (n) { return !isNaN(n); });
  return times.length ? Math.max.apply(null, times) : null;
}

function daysSince(ms) {
  return Math.floor((Date.now() - ms) / 86400000);
}

// Thresholds are a quote-follow-up cadence, not arbitrary: a shed quote is
// live for about a week, worth one more push out to a month, and effectively
// dead after that.
function temperatureFor(days) {
  if (days <= 3) return { cls: 'temp-hot', label: 'Hot' };
  if (days <= 10) return { cls: 'temp-warm', label: 'Warm' };
  if (days <= 30) return { cls: 'temp-cold', label: 'Cold' };
  return { cls: 'temp-dormant', label: 'Dormant' };
}

function agoLabel(days) {
  if (days <= 0) return 'today';
  if (days === 1) return 'yesterday';
  if (days < 30) return days + ' days ago';
  var months = Math.floor(days / 30);
  return months === 1 ? '1 month ago' : months + ' months ago';
}

// Only open pipeline states get a temperature. A won or lost deal doesn't
// need chasing, and a superseded design isn't the live one.
var OPEN_STATUSES = ['new', 'contacted', 'quoted'];

function todayISO() {
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

// Precedence, strongest first:
//   1. a revisit date that has arrived — the whole reason for setting one
//   2. a temperature pinned by hand — the customer told you their timeline,
//      which beats anything inferred from how long ago you spoke
//   3. computed from last activity
function resolveTemperature(c, days) {
  if (c.follow_up_at && c.follow_up_at <= todayISO()) {
    return { cls: 'temp-due', label: 'Follow up due', pinned: true,
             why: 'Revisit date was ' + c.follow_up_at };
  }
  if (c.temp_override) {
    return { cls: 'temp-' + c.temp_override, pinned: true,
             label: c.temp_override.charAt(0).toUpperCase() + c.temp_override.slice(1),
             why: 'Set by hand — not from activity' };
  }
  var t = temperatureFor(days);
  t.why = 'Quoted ' + agoLabel(days) + '. Based on how long they have sat on the quote, not on your follow-up.';
  return t;
}

function renderActivityCell(td, c) {
  var quoted = quoteAgeMs(c);
  if (!quoted) { td.textContent = '—'; return; }

  var date = document.createElement('span');
  date.className = 'act-date';
  date.textContent = new Date(quoted).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
  td.appendChild(date);

  var days = daysSince(quoted);
  var ago = document.createElement('span');
  ago.className = 'act-ago';
  ago.textContent = 'quoted ' + agoLabel(days);
  td.appendChild(ago);

  // Your side of it, stated plainly rather than dressed up as the customer's
  // interest. Only shown when there IS contact: an absence of logged calls
  // usually means nobody wrote one down, not that nobody rang — so flagging
  // every such row in orange was accusing the record-keeping, not surfacing a
  // neglected lead.
  var contact = lastContactMs(c);
  if (contact) {
    var reach = document.createElement('span');
    reach.className = 'act-ago';
    reach.textContent = 'contacted ' + agoLabel(daysSince(contact));
    td.appendChild(reach);
  }

  if (OPEN_STATUSES.indexOf(c.latest_status || 'new') === -1) return;
  var t = resolveTemperature(c, days);
  var pill = document.createElement('span');
  pill.className = 'temp ' + t.cls + (t.pinned ? ' pinned' : '');
  pill.textContent = t.label;
  pill.title = t.why;
  td.appendChild(pill);

  // A revisit still in the future is worth showing — it's the answer to "why
  // is this one cold?" without opening the customer.
  if (c.follow_up_at && c.follow_up_at > todayISO()) {
    var rv = document.createElement('span');
    rv.className = 'revisit';
    rv.textContent = 'revisit ' + new Date(c.follow_up_at + 'T00:00:00')
      .toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    td.appendChild(rv);
  }
}

/* Lost customers always sit at the bottom, below everyone else, keeping the
   server's order (newest activity first) inside each group. "Lost" is a
   submission status, not a customer field, so it is read the way the Status
   column reads it: from the customer's latest order. */
function isLostCustomer(c) { return c.latest_status === 'lost'; }
function lostLast(list) {
  return list.filter(function (c) { return !isLostCustomer(c); })
    .concat(list.filter(isLostCustomer));
}
function digits(v) { return String(v || '').replace(/\D/g, ''); }
function customerMatches(c, q) {
  q = q.trim().toLowerCase();
  if (!q) return true;
  var ids = (c.orders || []).map(function (o) { return String(o.id); });
  if (c.latest_submission_id != null) ids.push(String(c.latest_submission_id));
  var hay = [c.name, c.email, c.phone, c.address, c.city, c.state, c.zip].join(' ').toLowerCase();
  return q.split(/\s+/).every(function (w) {
    var num = w.replace(/^#/, '');
    if (/^\d+$/.test(num) && ids.indexOf(num) > -1) return true;
    if (hay.indexOf(w) > -1) return true;
    var d = digits(w);
    return d.length >= 3 && digits(c.phone).indexOf(d) > -1;
  });
}
var ALL_CUSTOMERS = [];
function applySearch() {
  var box = document.getElementById('cust-search');
  var q = box ? box.value : '';
  var shown = lostLast(ALL_CUSTOMERS.filter(function (c) { return customerMatches(c, q); }));
  var cnt = document.getElementById('search-count');
  if (cnt) cnt.textContent = q.trim() ? shown.length + ' of ' + ALL_CUSTOMERS.length + ' customers' : '';
  renderCustomers(shown, !!q.trim());
}
(function () {
  var box = document.getElementById('cust-search');
  if (box) box.addEventListener('input', applySearch);
})();

/* Shop order: the quote for the build the shop is making, the same
   quote.html?id= link as "Generate Quote" on the customer page, picked the
   same way (chosen, else won, else newest). Several won builds open a picker. */
var SHOP_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8M8 17h5"/></svg>';
function shopOrders(c) {
  var orders = c.orders || [];
  var chosen = orders.filter(function (o) { return o.chosen_at; });
  if (chosen.length) return chosen;
  var won = orders.filter(function (o) { return o.status === 'won'; });
  if (won.length) return won;
  if (orders.length) return [orders[0]];
  return c.latest_submission_id ? [{ id: c.latest_submission_id, status: c.latest_status }] : [];
}
function closeShopPicks() {
  document.querySelectorAll('.shop-pick').forEach(function (p) { p.remove(); });
}
document.addEventListener('click', function (e) { if (!e.target.closest('.shop-btn')) closeShopPicks(); });
function shopButton(c) {
  var picks = shopOrders(c);
  if (!picks.length) return null;
  var b = document.createElement(picks.length === 1 ? 'a' : 'span');
  b.className = 'shop-btn';
  b.title = picks.length === 1 ? 'Open the shop order (quote #' + picks[0].id + ')' : 'Open a shop order (' + picks.length + ' builds)';
  b.setAttribute('aria-label', b.title);
  b.innerHTML = SHOP_ICON + '<span>Shop order</span>';
  if (picks.length === 1) {
    b.href = 'quote.html?id=' + picks[0].id;
    b.target = '_blank';
  } else {
    b.setAttribute('role', 'button');
    b.tabIndex = 0;
    b.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); b.click(); } });
    b.addEventListener('click', function (e) {
      if (e.target.closest('.shop-pick')) return;
      e.preventDefault();
      var open = b.querySelector('.shop-pick');
      closeShopPicks();
      if (open) return;
      var m = document.createElement('div');
      m.className = 'shop-pick';
      picks.forEach(function (o) {
        var a = document.createElement('a');
        a.href = 'quote.html?id=' + o.id;
        a.target = '_blank';
        a.textContent = 'Quote #' + o.id + (o.chosen_at ? ' \u2605 chosen' : o.status === 'won' ? ' \u00b7 won' : '');
        a.addEventListener('click', function (ev) { ev.stopPropagation(); setTimeout(closeShopPicks, 0); });
        m.appendChild(a);
      });
      b.appendChild(m);
    });
  }
  return b;
}

function renderCustomers(list, searching) {
  var body = document.getElementById('customers-body');
  body.innerHTML = '';
  if (!list.length) {
    body.innerHTML = '<tr><td class="empty" colspan="8">' + (searching ? 'No customers match that search.' : 'No customers yet.') + '</td></tr>';
    return;
  }
  list.forEach(function (c) {
    var tr = document.createElement('tr');
    var isNew = c.latest_status === 'new';
    if (isNew) tr.className = 'lead-new';

    var tdDate = document.createElement('td');
    tdDate.setAttribute('data-label', 'Last Activity');
    renderActivityCell(tdDate, c);

    var tdName = document.createElement('td');
    tdName.setAttribute('data-label', 'Name');
    var nameWrap = document.createElement('div');
    nameWrap.className = 'name-cell';
    var nameText = document.createElement('span');
    nameText.textContent = c.name || '—';
    nameWrap.appendChild(nameText);
    if (isNew) {
      var badge = document.createElement('span');
      badge.className = 'new-badge';
      badge.textContent = 'New Lead';
      nameWrap.appendChild(badge);
    }
    if (c.latest_is_consult) {
      var cb = document.createElement('span');
      cb.className = 'consult-badge';
      cb.textContent = 'Wants a call';
      nameWrap.appendChild(cb);
    }
    var shop = shopButton(c);
    if (shop) nameWrap.appendChild(shop);
    tdName.appendChild(nameWrap);

    var tdEmail = document.createElement('td');
    tdEmail.setAttribute('data-label', 'Email');
    tdEmail.textContent = c.email || '—';

    var tdPhone = document.createElement('td');
    tdPhone.setAttribute('data-label', 'Phone');
    tdPhone.textContent = c.phone || '—';

    var tdQuote = document.createElement('td');
    tdQuote.setAttribute('data-label', 'Latest Quote');
    if (c.latest_quoted_price != null) {
      // Math.round, because the pricing engine returns full floating-point
      // dollars: an $8,944.147 in this column is a rendering bug, not a price.
      tdQuote.textContent = '$' + Math.round(c.latest_quoted_price).toLocaleString();
    } else if (c.latest_consult_estimate != null) {
      // Dimmed and suffixed — this is where their unfinished design stood when
      // they asked to talk, not a price anyone has been given.
      tdQuote.textContent = '$' + Math.round(c.latest_consult_estimate).toLocaleString() + ' so far';
      tdQuote.style.color = 'var(--dim)';
    } else {
      tdQuote.textContent = '—';
    }
    if (c.submission_count > 1) {
      var countTag = document.createElement('span');
      countTag.style.display = 'block';
      countTag.style.fontFamily = "'DM Mono',monospace";
      countTag.style.fontSize = '10px';
      countTag.style.color = 'var(--dim)';
      countTag.textContent = c.submission_count + ' designs';
      tdQuote.appendChild(countTag);
    }

    var tdStatus = document.createElement('td');
    tdStatus.setAttribute('data-label', 'Status');
    var statusWrap = document.createElement('div');
    statusWrap.className = 'status-wrap';
    tdStatus.appendChild(statusWrap);
    if (c.latest_status === 'superseded') {
      var supTag = document.createElement('span');
      supTag.style.fontFamily = "'DM Mono',monospace";
      supTag.style.fontSize = '11px';
      supTag.style.color = 'var(--dim)';
      supTag.textContent = 'Replaced';
      statusWrap.appendChild(supTag);
    } else {
      var dot = document.createElement('span');
      dot.className = 'status-dot status-' + (c.latest_status || 'new');
      var select = document.createElement('select');
      ['new', 'contacted', 'quoted', 'won', 'lost'].forEach(function (opt) {
        var o = document.createElement('option');
        o.value = opt;
        o.textContent = opt;
        if (opt === (c.latest_status || 'new')) o.selected = true;
        select.appendChild(o);
      });
      select.addEventListener('change', function () {
        dot.className = 'status-dot status-' + select.value;
        if (c.latest_submission_id) {
          var send = function (extra) {
            var b = { id: c.latest_submission_id, status: select.value };
            if (extra) { b.lost_reason = extra.lost_reason; b.lost_note = extra.lost_note; b.lost_competitor = extra.lost_competitor; }
            authFetch('/admin/submissions/status', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(b)
            }).catch(function () {});
          };
          if (select.value === 'lost' && window.askLostReason) window.askLostReason(null, send); else send(null);
        }
      });
      statusWrap.appendChild(dot);
      statusWrap.appendChild(select);
    }

    var tdNote = document.createElement('td');
    tdNote.className = 'note-cell';
    tdNote.setAttribute('data-label', 'Latest Note');
    if (c.latest_note) {
      var noteText = document.createElement('span');
      noteText.textContent = c.latest_note.length > 80 ? c.latest_note.slice(0, 80) + '…' : c.latest_note;
      tdNote.appendChild(noteText);
      var noteTime = document.createElement('span');
      noteTime.className = 'note-time';
      noteTime.textContent = new Date(c.latest_note_at).toLocaleDateString();
      tdNote.appendChild(noteTime);
    } else {
      tdNote.textContent = '—';
    }

    var tdView = document.createElement('td');
    tdView.className = 'view-cell';
    var viewLink = document.createElement('a');
    viewLink.className = 'view-link';
    viewLink.href = 'admin-customer.html?id=' + c.id;
    viewLink.textContent = 'View →';
    tdView.appendChild(viewLink);

    tr.appendChild(tdDate);
    tr.appendChild(tdName);
    tr.appendChild(tdEmail);
    tr.appendChild(tdPhone);
    tr.appendChild(tdQuote);
    tr.appendChild(tdStatus);
    tr.appendChild(tdNote);
    tr.appendChild(tdView);
    body.appendChild(tr);
  });
}

function loadCustomers() {
  authFetch('/admin/customers').then(function (r) {
    if (r.ok) { ALL_CUSTOMERS = r.data.customers || []; applySearch(); }
  });
}

if (token) {
  // Silently keeps stale "new" submissions (superseded by a newer one from
  // the same customer, whether or not that newer one was already actioned)
  // reclassified in the background — no button to click, just happens on
  // every page load. Cheap and safe to run repeatedly: once caught up,
  // there's nothing left to fix.
  authFetch('/admin/submissions/cleanup-superseded', { method: 'POST' }).catch(function () {}).then(function () {
    loadCustomers();
  });
}

/* The dot in the header. Fire-and-forget: a feed that will not load must not
   stop the page it is decorating from working. */
(function () {
  if (!window.AdminActivity) return;
  AdminActivity.load(authFetch, { limit: 80 }).then(function (r) {
    AdminNav.setCount(r.unseen);
  }).catch(function () {});
})();

AdminNav.render(document.querySelector('.h-actions'));
</script>
</body>
</html>
