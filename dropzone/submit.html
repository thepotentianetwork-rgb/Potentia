<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Drop Zone — Potentia Network</title><link rel="stylesheet" href="/dropzone/style.css"></head><body><div class="wrap">
<div class="brand">Potentia Network · Drop Zone</div><h1 id="t">Request a change</h1><p class="sub" id="s"></p>
<form id="f" class="card"><input type="hidden" name="source" id="source">
<div class="drop" id="drop"><b>Drop Zone</b> — drop screenshots here<br>or click to choose · PNG, JPG, WEBP · up to 8 images, 5MB each<div id="pv"></div></div>
<input type="file" name="screenshot" id="file" accept="image/png,image/jpeg,image/webp" multiple hidden>
<label>Business name *</label><input name="business" required maxlength="200" placeholder="Your business or project name">
<label>Access password *</label><input name="access" type="password" required autocomplete="off" placeholder="Provided by Potentia Network">
<div id="siteRow"><label>Website address (optional)</label><input name="site" placeholder="https://yourbusiness.com"></div>
<label>Describe the change you need *</label><textarea name="note" required placeholder="e.g. Move the phone number to the top and make it bigger…"></textarea>
<div class="row"><div><label>Name (optional)</label><input name="name"></div><div><label>Email (optional)</label><input name="email" type="email"></div></div>
<p><button id="b">Send request</button></p><div id="m"></div></form></div>
<script>
if(new URLSearchParams(location.search).has("embed"))document.body.style.background="var(--deep)";
const src=location.pathname.startsWith("/dropzone/website")?'website':'crm';source.value=src;
if(src=='website'){t.textContent='Request a website change';s.textContent='Show us what to change on your website. We\'ll review it before anything is touched.'}
else{t.textContent='Request a CRM change';s.textContent='Spotted something in Potentia Network CRM you\'d like changed? Drop a screenshot and tell us.';siteRow.hidden=true}
document.title='Drop Zone · '+t.textContent+' — Potentia Network';
const qs=new URLSearchParams(location.search);if(qs.get("site"))f.site.value=qs.get("site");
const ok=['image/png','image/jpeg','image/webp'];
let FILES=[];
function render(){pv.innerHTML='';FILES.forEach((x,i)=>{const w=document.createElement('span');w.style.cssText='position:relative;display:inline-block;margin:6px';
 const im=new Image();im.src=URL.createObjectURL(x);im.style.cssText='max-height:120px;max-width:160px;border-radius:8px';
 const r=document.createElement('button');r.type='button';r.textContent='×';r.title='Remove';r.style.cssText='position:absolute;top:-8px;right:-8px;padding:0 8px;border-radius:50%;font-size:14px';
 r.onclick=ev=>{ev.stopPropagation();FILES.splice(i,1);render()};w.append(im,r);pv.append(w)})}
function pick(fl){m.innerHTML='';for(const x of fl||[]){if(!ok.includes(x.type)){show('Please choose PNG, JPG or WEBP images.',1);continue}
 if(x.size>5242880){show(x.name+' is over 5MB.',1);continue}if(FILES.length>=8){show('Up to 8 screenshots per request.',1);break}FILES.push(x)}file.value='';render()}
drop.onclick=()=>file.click();file.onchange=()=>pick(file.files);
['dragover','dragenter'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.add('over')}));
['dragleave','drop'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.remove('over')}));
drop.addEventListener('drop',e=>pick(e.dataTransfer.files));
function show(x,e){m.innerHTML='<div class="msg '+(e?'err':'ok')+'"></div>';m.firstChild.textContent=x}
f.onsubmit=async e=>{e.preventDefault();b.disabled=true;try{const r=await fetch('/dropzone/api/feedback',{method:'POST',body:(()=>{const d=new FormData(f);d.delete('screenshot');FILES.forEach(x=>d.append('screenshot',x,x.name));return d})()});const j=await r.json();
 if(!r.ok)throw Error(j.error);const bz=f.business.value,ac=f.access.value;f.reset();source.value=src;f.business.value=bz;f.access.value=ac;FILES=[];pv.innerHTML='';show('Thanks! Your request was received and is pending review. Nothing changes until it\'s reviewed.')}catch(x){show(x.message||'Something went wrong',1)}b.disabled=false}
</script></body></html>
