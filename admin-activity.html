<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Activity — ShedPro</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="shedpro-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Syncopate:wght@400;700&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --black:#040407;--deep:#08080f;--chrome:#c8cdd6;--silver:#8a909e;--bright:#e8ecf4;--dim:#2a2d38;
  --sp-blue:#2cc0fd;--sp-blue-deep:#1c8fc2;--sp-orange:#f6941f;
}
body{background:var(--black);color:var(--chrome);font-family:'Cormorant Garamond',serif;min-height:100vh}

header{border-bottom:1px solid var(--dim);border-image:linear-gradient(90deg,var(--sp-blue),var(--sp-orange)) 1;padding:20px 40px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.h-brand{display:flex;align-items:center;gap:14px}
.h-brand img{width:34px;height:34px;object-fit:contain}
.h-brand-text{display:flex;flex-direction:column;gap:2px}
.h-title{font-family:'Syncopate',sans-serif;font-size:12px;letter-spacing:0.2em;color:var(--bright)}
.h-sub{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:0.2em;color:var(--silver);text-transform:uppercase}
.h-actions{display:flex;gap:20px;align-items:center}
.back-link{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:0.15em;color:var(--silver);text-decoration:none;text-transform:uppercase;position:relative}
.back-link:hover{color:var(--sp-blue)}
.back-link.here{color:var(--sp-blue)}
.logout{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:0.15em;color:var(--silver);text-transform:uppercase;background:none;border:1px solid var(--dim);padding:9px 18px;cursor:pointer;transition:all 0.3s}
.logout:hover{border-color:var(--sp-blue);color:var(--bright)}
.act-badge{display:inline-block;margin-left:6px;font-family:'DM Mono',monospace;font-size:9px;line-height:1;color:var(--black);background:var(--sp-orange);border-radius:20px;padding:3px 6px;vertical-align:top}

main{max-width:880px;margin:0 auto;padding:48px 40px 100px}
.sec-label{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:0.4em;color:var(--dim);text-transform:uppercase;margin-bottom:8px}
h2{font-size:30px;font-weight:300;color:var(--bright);margin-bottom:6px}
.lede{font-size:15px;color:var(--silver);margin-bottom:22px;line-height:1.6;max-width:62ch}

.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.filter-btn{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:var(--silver);background:none;border:1px solid var(--dim);padding:8px 13px;cursor:pointer;transition:all 0.2s}
.filter-btn:hover{border-color:var(--sp-blue);color:var(--bright)}
.filter-btn.on{border-color:var(--sp-blue);color:var(--sp-blue);background:rgba(44,192,253,0.08)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin:16px 0 22px}
.count{font-family:'DM Mono',monospace;font-size:11px;color:var(--dim);letter-spacing:0.08em}
.mark-read{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:var(--silver);background:none;border:1px solid var(--dim);padding:8px 13px;cursor:pointer}
.mark-read:hover{border-color:var(--sp-blue);color:var(--bright)}
.mark-read[disabled]{opacity:0.4;pointer-events:none}

.ev{display:flex;gap:14px;align-items:flex-start;padding:15px 16px;border:1px solid var(--dim);border-left-width:3px;margin-bottom:10px;transition:background 0.2s}
.ev:hover{background:rgba(255,255,255,0.02)}
.ev.paid{border-left-color:#5fd08a}
.ev.invoiced{border-left-color:var(--sp-blue)}
.ev.callback{border-left-color:#5aa9e6}
.ev.design{border-left-color:var(--sp-orange)}
.ev.new{background:rgba(246,148,31,0.06)}
.ev-tag{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:0.14em;text-transform:uppercase;padding:4px 9px;border-radius:20px;flex-shrink:0;margin-top:2px;white-space:nowrap;border:1px solid}
.tag-paid{color:#5fd08a;border-color:rgba(95,208,138,0.5);background:rgba(95,208,138,0.1)}
.tag-invoiced{color:var(--sp-blue);border-color:rgba(44,192,253,0.45);background:rgba(44,192,253,0.08)}
.tag-callback{color:#5aa9e6;border-color:rgba(90,169,230,0.45);background:rgba(90,169,230,0.1)}
.tag-design{color:var(--sp-orange);border-color:rgba(246,148,31,0.45);background:rgba(246,148,31,0.1)}
.ev-body{flex:1;min-width:0}
.ev-text{font-size:18px;color:var(--bright);line-height:1.4}
.ev-sub{font-size:14px;color:var(--silver);margin-top:4px;line-height:1.5}
.ev-when{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:0.08em;color:var(--dim);text-transform:uppercase;margin-top:7px}
.ev-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.act{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--sp-blue);text-decoration:none;border:1px solid rgba(44,192,253,0.45);padding:6px 10px;white-space:nowrap}
.act:hover{background:rgba(44,192,253,0.12)}
.ev-dot{width:7px;height:7px;border-radius:50%;background:var(--sp-orange);flex-shrink:0;margin-top:9px}

.empty{font-family:'DM Mono',monospace;font-size:12px;color:var(--dim);padding:40px 0;line-height:1.8}

@media (max-width:760px){
  header{padding:16px 20px}
  .h-actions{gap:10px}
  main{padding:30px 18px 80px}
  h2{font-size:24px}
  .ev{flex-wrap:wrap;gap:10px}
  .act{flex:1;text-align:center}
}
</style>
</head>
<body>

<header>
  <div class="h-brand">
    <img src="shedpro-logo.png" alt="ShedPro">
    <div class="h-brand-text">
      <span class="h-title">SHEDPRO ADMIN</span>
      <span class="h-sub">Built &amp; managed by Potentia</span>
    </div>
  </div>
  <div class="h-actions">
    <a href="admin.html" class="back-link">← Customers</a>
    <a href="admin-schedule.html" class="back-link">Schedule</a>
    <a href="admin-activity.html" class="back-link here">Activity<span class="act-badge" id="hdr-badge" style="display:none"></span></a>
    <button class="logout" id="logout-btn">Log Out</button>
  </div>
</header>

<main>
  <p class="sec-label">ShedPro Partner</p>
  <h2>Activity</h2>
  <p class="lede">Money in, invoices out, and anyone new — newest first. Highlighted rows arrived since you last looked here.</p>

  <div class="filters" id="filters"></div>
  <div class="bar">
    <span class="count" id="count"></span>
    <button class="mark-read" id="mark-read" type="button" disabled>Mark all as seen</button>
  </div>
  <div id="list"><p class="empty">Loading…</p></div>
</main>

<script src="admin-activity.js"></script>
<script>
var API_BASE = "https://potentia-assistant.thepotentianetwork.workers.dev";
var token = localStorage.getItem('potentia_admin_token');

if (!token) {
  window.location.href = 'admin-login.html';
}

function authFetch(path, options) {
  options = options || {};
  options.headers = Object.assign({}, options.headers, { 'Authorization': 'Bearer ' + token });
  return fetch(API_BASE + path, options).then(function (res) {
    if (res.status === 401) {
      localStorage.removeItem('potentia_admin_token');
      window.location.href = 'admin-login.html';
      throw new Error('Session expired');
    }
    return res.json().then(function (data) { return { ok: res.ok, data: data }; });
  });
}

document.getElementById('logout-btn').addEventListener('click', function () {
  localStorage.removeItem('potentia_admin_token');
  window.location.href = 'admin-login.html';
});

var FILTERS = [
  { key: 'all', label: 'Everything', match: function () { return true; } },
  { key: 'payment', label: 'Payments', match: function (e) { return e.kind === 'payment'; } },
  { key: 'invoice_sent', label: 'Invoices', match: function (e) { return e.kind === 'invoice_sent'; } },
  { key: 'leads', label: 'New leads', match: function (e) { return e.kind === 'order' || e.kind === 'consult'; } }
];
var current = 'all';
var EVENTS = [];
var LATEST = null;

var CLS = { payment: 'paid', invoice_sent: 'invoiced', consult: 'callback', order: 'design' };

function renderFilters() {
  var wrap = document.getElementById('filters');
  wrap.innerHTML = '';
  FILTERS.forEach(function (f) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'filter-btn' + (f.key === current ? ' on' : '');
    b.textContent = f.label;
    b.addEventListener('click', function () {
      current = f.key;
      renderFilters();
      renderList();
    });
    wrap.appendChild(b);
  });
}

function eventRow(e) {
  var cls = CLS[e.kind] || 'design';
  var row = document.createElement('div');
  row.className = 'ev ' + cls + (e.unseen ? ' new' : '');

  if (e.unseen) {
    var dot = document.createElement('span');
    dot.className = 'ev-dot';
    row.appendChild(dot);
  }

  var tag = document.createElement('span');
  tag.className = 'ev-tag tag-' + cls;
  tag.textContent = AdminActivity.label(e);
  row.appendChild(tag);

  var body = document.createElement('div');
  body.className = 'ev-body';

  var text = document.createElement('div');
  text.className = 'ev-text';
  text.textContent = AdminActivity.describe(e);
  body.appendChild(text);

  var sub = [];
  if (e.kind === 'payment' && e.note) sub.push(e.note);
  if (e.kind === 'invoice_sent' && e.status) sub.push(e.status === 'paid' ? 'since paid' : e.status);
  if (e.kind === 'consult' && e.best_time) sub.push('Best time: ' + e.best_time);
  if (e.kind === 'consult' && e.question) sub.push('“' + e.question + '”');
  if (e.kind === 'order' && e.summary) sub.push(e.summary);
  if (e.submission_id) sub.push('Order #' + e.submission_id);
  if (sub.length) {
    var s = document.createElement('div');
    s.className = 'ev-sub';
    s.textContent = sub.join(' · ');
    body.appendChild(s);
  }

  var when = document.createElement('div');
  when.className = 'ev-when';
  when.textContent = AdminActivity.ago(e.at);
  body.appendChild(when);

  var acts = document.createElement('div');
  acts.className = 'ev-acts';
  if (e.customer_id) {
    var open = document.createElement('a');
    open.className = 'act';
    open.href = 'admin-customer.html?id=' + e.customer_id;
    open.textContent = 'Open customer';
    acts.appendChild(open);
  }
  if (e.hosted_url) {
    var inv = document.createElement('a');
    inv.className = 'act';
    inv.href = e.hosted_url;
    inv.target = '_blank';
    inv.rel = 'noopener';
    inv.textContent = 'Invoice ↗';
    acts.appendChild(inv);
  }
  body.appendChild(acts);

  row.appendChild(body);
  return row;
}

function renderList() {
  var f = FILTERS.filter(function (x) { return x.key === current; })[0];
  var shown = EVENTS.filter(f.match);
  var list = document.getElementById('list');
  var count = document.getElementById('count');
  list.innerHTML = '';

  var unseen = EVENTS.filter(function (e) { return e.unseen; }).length;
  AdminActivity.badge(document.getElementById('hdr-badge'), unseen);
  document.getElementById('mark-read').disabled = unseen === 0;

  if (!shown.length) {
    count.textContent = '';
    list.innerHTML = '<p class="empty">Nothing here yet.</p>';
    return;
  }
  count.textContent = shown.length + (shown.length === 1 ? ' item' : ' items') +
    (unseen ? ' · ' + unseen + ' new' : '');
  shown.forEach(function (e) { list.appendChild(eventRow(e)); });
}

document.getElementById('mark-read').addEventListener('click', function () {
  AdminActivity.writeSeen(LATEST);
  EVENTS = EVENTS.map(function (e) { return Object.assign({}, e, { unseen: false }); });
  renderList();
});

function load() {
  AdminActivity.load(authFetch, { limit: 80 }).then(function (r) {
    EVENTS = r.events;
    LATEST = r.latest;
    renderList();
  }).catch(function () {
    document.getElementById('list').innerHTML =
      '<p class="empty">Could not reach the server.</p>';
  });
}

renderFilters();
load();
</script>
</body>
</html>
