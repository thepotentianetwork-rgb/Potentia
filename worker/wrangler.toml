name = "potentia-assistant"
main = "index.js"
compatibility_date = "2026-08-01"

# Lead pipeline schedule.
#
# The interval must stay at an hour or MORE. Cloudflare gives a scheduled
# handler 30 seconds of CPU below an hour and 15 minutes at an hour or above,
# and a run makes several slow AI calls. Waiting on fetch() is not CPU time, so
# the work fits the 15-minute tier easily and would be tight in the 30-second
# one — dropping this to */30 would quietly move it to the short tier.
#
# NOTE: this Worker is deployed by pasting worker/dist/index.bundle.js into the
# dashboard, not by `wrangler deploy`, so this block documents the intent — the
# trigger itself has to be added in the dashboard under
#   Workers & Pages -> potentia-assistant -> Settings -> Triggers -> Cron.
[triggers]
# "0 9 * * *" = daily auto-dormant (14 days without a status change).
crons = ["0 * * * *", "0 9 * * *"]

# D1 bindings — must stay in this file or `wrangler deploy` drops them
# (dropped bindings caused the Partner Admin login outage on 2026-11-03).
[[d1_databases]]
binding = "DB"
database_name = "potentia-shed"
database_id = "0a6eec64-0670-4854-9dec-b2a1e3eec42b"

[[d1_databases]]
binding = "CRM_DB"
database_name = "potentia-crm"
database_id = "ffb5677f-547b-42cc-ace5-fb095820e622"

# R2 for the quote's 3D snapshot. Must stay in this file or `wrangler deploy`
# drops the binding — the same failure mode as the D1 outage on 2026-11-03.
# On 2026-11-13 the live Worker settings had no RENDERS binding, so uploads
# were silently skipped (uploadRenders returns null without it).
[[r2_buckets]]
binding = "RENDERS"
bucket_name = "potentia-shed-renders"

[vars]
RENDERS_PUBLIC_BASE = "https://pub-cccde765f8c347f7bd7c9ca08b53eab4.r2.dev"
