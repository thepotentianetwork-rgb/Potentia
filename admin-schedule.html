<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schedule — ShedPro</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="shedpro-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Syncopate:wght@400;700&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --black:#040407;--deep:#08080f;--chrome:#c8cdd6;--silver:#8a909e;--bright:#e8ecf4;--dim:#2a2d38;
  --sp-blue:#2cc0fd;--sp-blue-deep:#1c8fc2;--sp-orange:#f6941f;
  /* The same green the quote page and the customer's tracking page use for a
     thing that is finished. */
  --sp-green:#3ddc97;
}
body{background:var(--black);color:var(--chrome);font-family:'Cormorant Garamond',serif;min-height:100vh}

header{border-bottom:1px solid var(--dim);border-image:linear-gradient(90deg,var(--sp-blue),var(--sp-orange)) 1;padding:20px 40px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.h-brand{display:flex;align-items:center;gap:14px}
.h-brand img{width:34px;height:34px;object-fit:contain}
.h-brand-text{display:flex;flex-direction:column;gap:2px}
.h-title{font-family:'Syncopate',sans-serif;font-size:12px;letter-spacing:0.2em;color:var(--bright)}
.h-sub{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:0.2em;color:var(--silver);text-transform:uppercase}
.h-actions{display:flex;gap:20px;align-items:center}
.back-link{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:0.15em;color:var(--silver);text-decoration:none;text-transform:uppercase}
.back-link:hover{color:var(--sp-blue)}
.act-badge{display:inline-block;margin-left:6px;font-family:'DM Mono',monospace;font-size:9px;line-height:1;color:var(--black);background:var(--sp-orange);border-radius:20px;padding:3px 6px;vertical-align:top}
.back-link.here{color:var(--sp-blue)}
.logout{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:0.15em;color:var(--silver);text-transform:uppercase;background:none;border:1px solid var(--dim);padding:9px 18px;cursor:pointer;transition:all 0.3s}
.logout:hover{border-color:var(--sp-blue);color:var(--bright)}

main{max-width:1000px;margin:0 auto;padding:48px 40px 100px}
.sec-label{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:0.4em;color:var(--dim);text-transform:uppercase;margin-bottom:8px}
h2{font-size:30px;font-weight:300;color:var(--bright);margin-bottom:6px}
.lede{font-size:15px;color:var(--silver);margin-bottom:26px;line-height:1.6;max-width:62ch}

/* ---- range ---- */
.ranges{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.range-btn{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:var(--silver);background:none;border:1px solid var(--dim);padding:8px 13px;cursor:pointer;transition:all 0.2s}
.range-btn:hover{border-color:var(--sp-blue);color:var(--bright)}
.range-btn.on{border-color:var(--sp-blue);color:var(--sp-blue);background:rgba(44,192,253,0.08)}
.count{font-family:'DM Mono',monospace;font-size:11px;color:var(--dim);letter-spacing:0.08em;margin:14px 0 26px}

/* ---- month grid ---- */
.monthbar{display:flex;align-items:center;gap:10px;margin-top:12px}
.month-name{font-size:21px;font-weight:300;color:var(--bright);min-width:200px}
.cal-head{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
.cal-dow{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:0.14em;text-transform:uppercase;color:var(--dim);text-align:center;padding:4px 0}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-day{min-height:96px;border:1px solid var(--dim);padding:7px 7px 8px;display:flex;flex-direction:column;gap:5px;background:none;color:inherit;font:inherit;text-align:left;cursor:default}
.cal-day.has{cursor:pointer}
.cal-day.has:hover{border-color:var(--sp-blue)}
.cal-day.out{opacity:0.32}
.cal-day.today{border-color:#5fd08a;box-shadow:inset 0 0 0 1px rgba(95,208,138,0.35)}
.cal-day.picked{border-color:var(--sp-blue);background:rgba(44,192,253,0.07)}
.cal-num{font-family:'DM Mono',monospace;font-size:11px;color:var(--silver);letter-spacing:0.06em}
.cal-day.today .cal-num{color:#5fd08a}
.cal-chip{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:0.06em;padding:3px 5px;border-radius:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:1px solid}
.chip-shed{color:var(--sp-blue);border-color:rgba(44,192,253,0.45);background:rgba(44,192,253,0.1)}
.chip-ground{color:var(--silver);border-color:var(--dim);background:rgba(255,255,255,0.03)}
.chip-shop{color:var(--sp-orange);border-color:rgba(246,148,31,0.45);background:rgba(246,148,31,0.1)}
.cal-more{font-family:'DM Mono',monospace;font-size:9px;color:var(--dim)}
.picked-head{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:var(--dim);margin:28px 0 10px}

@media (max-width:760px){
  .month-name{font-size:17px;min-width:135px}
  .cal-grid{gap:3px}
  .cal-day{min-height:56px;padding:4px 3px;gap:3px;align-items:center}
  /* The chips cannot fit at this width, so each job becomes a dot and the
     day opens to show them. A truncated name is worse than no name. */
  .cal-chip{width:6px;height:6px;padding:0;border-radius:50%;font-size:0;line-height:0}
  .cal-dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center}
  .cal-more{display:none}
}

/* ---- a day ---- */
.day{margin-bottom:34px}
.day-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding-bottom:8px;border-bottom:1px solid var(--dim);margin-bottom:14px}
.day-date{font-size:21px;font-weight:300;color:var(--bright)}
.day-when{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;padding:3px 9px;border-radius:20px;border:1px solid}
.when-today{color:#5fd08a;border-color:rgba(95,208,138,0.5);background:rgba(95,208,138,0.12)}
.when-soon{color:var(--sp-orange);border-color:rgba(246,148,31,0.45);background:rgba(246,148,31,0.1)}
.when-later{color:var(--silver);border-color:var(--dim)}
.when-past{color:var(--dim);border-color:var(--dim)}

/* ---- a job ---- */
.job{display:flex;gap:16px;align-items:flex-start;padding:14px 0;border-bottom:1px solid rgba(42,45,56,0.55)}
.job:last-child{border-bottom:none}
.job-item{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:0.14em;text-transform:uppercase;padding:4px 9px;border-radius:20px;flex-shrink:0;margin-top:3px;white-space:nowrap}
.item-shed{color:var(--sp-blue);border:1px solid rgba(44,192,253,0.45);background:rgba(44,192,253,0.08)}
.item-ground{color:var(--silver);border:1px solid var(--dim)}
.item-shop{color:var(--sp-orange);border:1px solid rgba(246,148,31,0.45);background:rgba(246,148,31,0.08)}
.job-body{flex:1;min-width:0}
.job-name{font-size:19px;color:var(--bright);text-decoration:none}
.job-name:hover{color:var(--sp-blue)}
.job-line{font-size:14px;color:var(--silver);margin-top:3px;line-height:1.55}
.job-note{font-size:14px;color:var(--chrome);margin-top:6px;padding-left:11px;border-left:2px solid var(--dim);line-height:1.5}
.job-meta{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:0.08em;color:var(--dim);text-transform:uppercase;margin-top:7px}
.job-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.act{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--sp-blue);text-decoration:none;border:1px solid rgba(44,192,253,0.45);padding:6px 10px;white-space:nowrap}
/* THE TICK. Its own class, not .act: those are ways of contacting a customer
   and this one writes to the database, so it should not look like them or be
   counted with them. Green because it is the one control on this page that the
   customer's own tracking page is reading. */
.tick{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--sp-green);background:none;border:1px solid rgba(61,220,151,0.45);padding:6px 10px;white-space:nowrap;cursor:pointer}
.tick:hover{background:rgba(61,220,151,0.12)}
.tick.is-done{color:var(--black);background:var(--sp-green);border-color:var(--sp-green);font-weight:700}
.tick:disabled{opacity:0.5;cursor:default}
.job.is-done .job-item{opacity:0.65}
.job.is-done .job-name{color:var(--silver)}
.act:hover{background:rgba(44,192,253,0.12)}
.act.quiet{color:var(--silver);border-color:var(--dim)}
.act.quiet:hover{border-color:var(--sp-blue);color:var(--bright);background:none}

.empty{font-family:'DM Mono',monospace;font-size:12px;color:var(--dim);padding:40px 0;line-height:1.8}

@media (max-width:760px){
  header{padding:16px 20px}
  .h-actions{gap:10px}
  main{padding:30px 18px 80px}
  h2{font-size:24px}
  .job{flex-direction:column;gap:8px}
  .job-item{margin-top:0}
  .act{flex:1;text-align:center}
}
</style>
</head>
<body>

<header>
  <div class="h-brand">
    <img src="shedpro-logo.png" alt="ShedPro">
    <div class="h-brand-text">
      <span class="h-title">SHEDPRO ADMIN</span>
      <span class="h-sub">Built &amp; managed by Potentia</span>
    </div>
  </div>
  <div class="h-actions">
    <button class="logout" id="logout-btn">Log Out</button>
  </div>
</header>

<main>
  <p class="sec-label">ShedPro Partner</p>
  <h2>Schedule</h2>
  <p class="lede">Every concrete pour and shed install, by date. Tap a name to open the job, or Invite to put it on Google Calendar with the customer as a guest.</p>

  <div class="ranges" id="views"></div>
  <div class="ranges" id="ranges"></div>
  <div class="monthbar" id="monthbar" hidden>
    <button class="range-btn" id="prev-month" type="button" aria-label="Previous month">‹</button>
    <span class="month-name" id="month-name"></span>
    <button class="range-btn" id="next-month" type="button" aria-label="Next month">›</button>
    <button class="range-btn" id="this-month" type="button">Today</button>
  </div>
  <div class="count" id="count"></div>
  <div id="cal" hidden></div>
  <div id="list"><p class="empty">Loading…</p></div>
</main>

<script src="admin-nav.js"></script>
<script src="admin-activity.js"></script>
<script>
var API_BASE = "https://potentia-assistant.thepotentianetwork.workers.dev";
var token = localStorage.getItem('potentia_admin_token');

if (!token) {
  window.location.href = 'admin-login.html';
}

function authFetch(path, options) {
  options = options || {};
  options.headers = Object.assign({}, options.headers, { 'Authorization': 'Bearer ' + token });
  return fetch(API_BASE + path, options).then(function (res) {
    if (res.status === 401) {
      localStorage.removeItem('potentia_admin_token');
      window.location.href = 'admin-login.html';
      throw new Error('Session expired');
    }
    return res.json().then(function (data) { return { ok: res.ok, data: data }; });
  });
}

document.getElementById('logout-btn').addEventListener('click', function () {
  localStorage.removeItem('potentia_admin_token');
  window.location.href = 'admin-login.html';
});

/* A stored install_date is a calendar day with no time in it. new Date('2026-10-15')
   parses that as UTC MIDNIGHT, which in Utah is the evening of the 14th — so the
   whole page would head a day early, every day, and nobody would think to
   question a date. Built from the parts in local time instead. */
function localDay(s) {
  var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s || ''));
  if (!m) return null;
  return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
}
function todayLocal() {
  var n = new Date();
  return new Date(n.getFullYear(), n.getMonth(), n.getDate());
}
function isoDay(d) {
  function p(n) { return (n < 10 ? '0' : '') + n; }
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}
function addDays(d, n) {
  return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
}
/* Whole days between two local midnights. Done on the calendar dates rather
   than by dividing milliseconds, which is off by an hour across a daylight
   saving change and can round "tomorrow" into "today". */
function daysBetween(a, b) {
  return Math.round((b - a) / 86400000);
}

/* Every stage a build can have. 'concrete' is the older single entry,
   kept so rows booked before the planner existed still read properly. */
var ITEM_LABEL = { prep: 'Site prep', pour: 'Pour', gravel: 'Gravel pad', shop: 'Shop build',
  shed: 'Install', concrete: 'Concrete' };
/* Which colour a stage wears. Shop days are deliberately a different
   colour from site days: one is a day in the shop and one is a drive. */
function itemClass(item) {
  if (item === 'shed') return 'shed';
  if (item === 'shop') return 'shop';
  if (item === 'prep' || item === 'pour' || item === 'gravel' || item === 'concrete') return 'ground';
  return 'shed';
}

var RANGES = [
  { key: 'week',  label: 'Next 7 days',  from: 0,    to: 7 },
  { key: 'month', label: 'Next 30 days', from: 0,    to: 30 },
  { key: 'all',   label: 'Everything',   from: null, to: null },
  { key: 'past',  label: 'Past',         from: -3650, to: -1 }
];
var current = 'month';

/* Month grid or plain list. The grid answers "what does October look like",
   the list answers "what is next" — both are asked, neither replaces the
   other. Remembered per device, because whichever you prefer you will prefer
   it every time. */
var VIEWS = [{ key: 'cal', label: 'Month' }, { key: 'list', label: 'List' }];
var VIEW_KEY = 'shedpro_schedule_view';
var view = 'cal';
try { view = localStorage.getItem(VIEW_KEY) || 'cal'; } catch (e) {}
if (view !== 'cal' && view !== 'list') view = 'cal';

var today = todayLocal();
var viewY = today.getFullYear();
var viewM = today.getMonth();
var picked = null;          // iso day the user tapped in the grid
var LOADED = [];

function rangeParams(r) {
  if (r.from === null) return '';
  var t = todayLocal();
  return '?from=' + isoDay(addDays(t, r.from)) + '&to=' + isoDay(addDays(t, r.to));
}

/* The 42 cells a month grid shows, starting on the Sunday on or before the
   1st. Fetching exactly this range means the leading and trailing days of the
   neighbouring months are populated too — an install on the 1st of next month
   is visible in this month's last row, which is where you would look for it. */
function gridStart(y, m) {
  var first = new Date(y, m, 1);
  return addDays(first, -first.getDay());
}
function gridDays(y, m) {
  var s = gridStart(y, m);
  var out = [];
  for (var i = 0; i < 42; i++) out.push(addDays(s, i));
  return out;
}
function monthParams() {
  var d = gridDays(viewY, viewM);
  return '?from=' + isoDay(d[0]) + '&to=' + isoDay(d[41]);
}

function renderViews() {
  var wrap = document.getElementById('views');
  wrap.innerHTML = '';
  VIEWS.forEach(function (v) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'range-btn' + (v.key === view ? ' on' : '');
    b.textContent = v.label;
    b.addEventListener('click', function () {
      if (view === v.key) return;
      view = v.key;
      try { localStorage.setItem(VIEW_KEY, view); } catch (e) {}
      picked = null;
      renderViews();
      applyView();
      load();
    });
    wrap.appendChild(b);
  });
}

/* Which controls belong to which view. The range buttons are meaningless in a
   month grid, and the month stepper is meaningless in a list. */
function applyView() {
  var cal = view === 'cal';
  document.getElementById('ranges').hidden = cal;
  document.getElementById('monthbar').hidden = !cal;
  document.getElementById('cal').hidden = !cal;
}

function renderRanges() {
  var wrap = document.getElementById('ranges');
  wrap.innerHTML = '';
  RANGES.forEach(function (r) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'range-btn' + (r.key === current ? ' on' : '');
    b.textContent = r.label;
    b.addEventListener('click', function () {
      current = r.key;
      renderRanges();
      load();
    });
    wrap.appendChild(b);
  });
}

function whenLabel(day, ref) {
  var n = daysBetween(ref, day);
  if (n === 0) return { text: 'Today', cls: 'when-today' };
  if (n === 1) return { text: 'Tomorrow', cls: 'when-soon' };
  if (n < 0) return { text: (-n) + (n === -1 ? ' day ago' : ' days ago'), cls: 'when-past' };
  if (n <= 7) return { text: 'In ' + n + ' days', cls: 'when-soon' };
  return { text: 'In ' + n + ' days', cls: 'when-later' };
}

function dayHeading(day) {
  return day.toLocaleDateString(undefined,
    { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
}

function jobRow(i) {
  var job = document.createElement('div');
  job.className = 'job';

  var tag = document.createElement('span');
  tag.className = 'job-item item-' + itemClass(i.item);
  tag.textContent = ITEM_LABEL[i.item] || i.item;
  job.appendChild(tag);

  var body = document.createElement('div');
  body.className = 'job-body';

  var name = document.createElement('a');
  name.className = 'job-name';
  name.href = 'admin-customer.html?id=' + i.customer_id;
  name.textContent = i.customer_name || 'Unnamed customer';
  body.appendChild(name);

  if (i.summary) {
    var sum = document.createElement('div');
    sum.className = 'job-line';
    sum.textContent = i.summary;
    body.appendChild(sum);
  }
  if (i.address) {
    var addr = document.createElement('div');
    addr.className = 'job-line';
    addr.textContent = i.address;
    body.appendChild(addr);
  }
  if (i.note) {
    var note = document.createElement('div');
    note.className = 'job-note';
    note.textContent = i.note;
    body.appendChild(note);
  }

  var bits = [];
  var n = Number(i.days);
  if (isFinite(n) && n > 0) bits.push(n + (n === 1 ? ' day' : ' days'));
  bits.push('Order #' + i.submission_id);
  if (i.order_status && i.order_status !== 'won') bits.push(i.order_status);
  var meta = document.createElement('div');
  meta.className = 'job-meta';
  meta.textContent = bits.join(' · ');
  body.appendChild(meta);

  var acts = document.createElement('div');
  acts.className = 'job-acts';
  if (i.customer_phone) {
    var call = document.createElement('a');
    call.className = 'act';
    call.href = 'tel:' + i.customer_phone;
    call.textContent = 'Call';
    acts.appendChild(call);

    var text = document.createElement('a');
    text.className = 'act';
    text.href = 'sms:' + i.customer_phone;
    text.textContent = 'Text';
    acts.appendChild(text);
  }
  if (i.address) {
    var map = document.createElement('a');
    map.className = 'act quiet';
    map.href = 'https://maps.apple.com/?q=' + encodeURIComponent(i.address);
    map.target = '_blank';
    map.rel = 'noopener';
    map.textContent = 'Map ↗';
    acts.appendChild(map);
  }
  /* Absent when the worker could not build a link from the stored date. A
     button that opens an empty calendar entry looks like it worked. */
  if (i.calendar_url) {
    var cal = document.createElement('a');
    cal.className = 'act';
    cal.href = i.calendar_url;
    cal.target = '_blank';
    cal.rel = 'noopener';
    cal.textContent = 'Invite ↗';
    acts.appendChild(cal);
  }

  /* THE ONE CONTROL ON THIS PAGE THAT A CUSTOMER SEES THE RESULT OF.
     Their tracking page moves on when this is tapped and not before, so it has
     to be cheap enough to do standing in a yard — one tap, no dialog, and
     tappable again to undo, because the wrong row is the likeliest mistake. */
  if (i.done_at) job.className += ' is-done';
  var tick = document.createElement('button');
  tick.type = 'button';
  tick.className = 'tick' + (i.done_at ? ' is-done' : '');
  tick.textContent = i.done_at ? '✓ Done' : 'Mark done';
  tick.title = i.done_at
    ? 'Done. Tap to undo — the customer’s tracking page follows this.'
    : 'Tap when this is finished. The customer’s tracking page follows this.';
  tick.onclick = function () { markDone(i, tick); };
  acts.appendChild(tick);

  body.appendChild(acts);

  job.appendChild(body);
  return job;
}

/* Writes the tick, then reloads so every copy of this job agrees — a multi-day
   install is drawn into each of its days, so the row tapped is one of several
   showing the same install. Updating just the button would leave the others
   saying the opposite. */
function markDone(install, btn) {
  var next = !install.done_at;
  btn.disabled = true;
  btn.textContent = next ? 'Saving…' : 'Undoing…';
  authFetch('/admin/installs/' + install.id + '/done', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ done: next })
  }).then(function (res) {
    if (!res.ok) throw new Error('HTTP ' + res.status);
    load();
  }).catch(function () {
    /* Says so rather than reverting silently. A tick that did not save, on a
       page the customer is reading, is worth a word. */
    btn.disabled = false;
    btn.textContent = next ? 'Did not save' : 'Did not undo';
    btn.title = 'That did not save. Check your connection and try again.';
  });
}

/* A job spans its whole booked length, so a three-day install shows on all
   three days rather than only the day it starts — which is the difference
   between a calendar and a list of start dates. */
function daysOf(i) {
  var d = localDay(i.install_date);
  if (!d) return [];
  var n = Number(i.days);
  var span = (isFinite(n) && n > 0) ? Math.max(1, Math.ceil(n)) : 1;
  var out = [];
  for (var k = 0; k < span; k++) out.push(isoDay(addDays(d, k)));
  return out;
}

function byDay(installs) {
  var map = {};
  installs.forEach(function (i) {
    daysOf(i).forEach(function (key, idx) {
      (map[key] = map[key] || []).push({ job: i, first: idx === 0 });
    });
  });
  return map;
}

function renderCalendar(installs) {
  var host = document.getElementById('cal');
  host.innerHTML = '';
  var map = byDay(installs);
  var t = todayLocal();

  document.getElementById('month-name').textContent =
    new Date(viewY, viewM, 1).toLocaleDateString(undefined, { month: 'long', year: 'numeric' });

  var head = document.createElement('div');
  head.className = 'cal-head';
  ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].forEach(function (d) {
    var c = document.createElement('div');
    c.className = 'cal-dow';
    c.textContent = d;
    head.appendChild(c);
  });
  host.appendChild(head);

  var grid = document.createElement('div');
  grid.className = 'cal-grid';

  gridDays(viewY, viewM).forEach(function (d) {
    var key = isoDay(d);
    var jobs = map[key] || [];
    var cell = document.createElement(jobs.length ? 'button' : 'div');
    if (jobs.length) cell.type = 'button';
    cell.className = 'cal-day' +
      (d.getMonth() === viewM ? '' : ' out') +
      (key === isoDay(t) ? ' today' : '') +
      (jobs.length ? ' has' : '') +
      (key === picked ? ' picked' : '');

    /* The cell's own date, so what is rendered can be checked against what
       was booked without counting squares. */
    cell.setAttribute('data-day', key);

    var num = document.createElement('span');
    num.className = 'cal-num';
    num.textContent = d.getDate();
    cell.appendChild(num);

    var dots = document.createElement('div');
    dots.className = 'cal-dots';
    jobs.slice(0, 3).forEach(function (entry) {
      var chip = document.createElement('span');
      chip.className = 'cal-chip chip-' + itemClass(entry.job.item);
      var who = (entry.job.customer_name || '').split(' ').slice(-1)[0] || '';
      /* A continuing day says so, rather than repeating the name as though a
         second job started. */
      chip.textContent = entry.first ? who : '· ' + who;
      chip.title = (ITEM_LABEL[entry.job.item] || '') + ' — ' + (entry.job.customer_name || '');
      dots.appendChild(chip);
    });
    if (jobs.length > 3) {
      var more = document.createElement('span');
      more.className = 'cal-more';
      more.textContent = '+' + (jobs.length - 3) + ' more';
      dots.appendChild(more);
    }
    cell.appendChild(dots);

    if (jobs.length) {
      cell.addEventListener('click', function () {
        picked = (picked === key) ? null : key;
        renderCalendar(LOADED);
      });
    }
    grid.appendChild(cell);
  });
  host.appendChild(grid);

  if (picked && map[picked]) {
    var head2 = document.createElement('div');
    head2.className = 'picked-head';
    head2.textContent = dayHeading(localDay(picked));
    host.appendChild(head2);
    map[picked].forEach(function (entry) { host.appendChild(jobRow(entry.job)); });
  }

  var n = installs.length;
  document.getElementById('count').textContent =
    n ? n + (n === 1 ? ' job this month' : ' jobs this month') : 'Nothing booked this month';
}

function renderList(installs, newestFirst) {
  var list = document.getElementById('list');
  var count = document.getElementById('count');
  list.innerHTML = '';

  if (!installs.length) {
    count.textContent = '';
    list.innerHTML = '<p class="empty">Nothing booked in this range.<br>' +
      'Install dates are set on a customer\u2019s order, once it is marked won.</p>';
    return;
  }

  count.textContent = installs.length + (installs.length === 1 ? ' job' : ' jobs');

  var t = todayLocal();
  var days = [];
  var map = {};
  installs.forEach(function (i) {
    var d = localDay(i.install_date);
    if (!d) return;
    var key = isoDay(d);
    if (!map[key]) { map[key] = { date: d, jobs: [] }; days.push(key); }
    map[key].jobs.push(i);
  });
  days.sort();
  if (newestFirst) days.reverse();

  days.forEach(function (key) {
    var group = map[key];
    var sec = document.createElement('div');
    sec.className = 'day';

    var h = document.createElement('div');
    h.className = 'day-head';
    var date = document.createElement('span');
    date.className = 'day-date';
    date.textContent = dayHeading(group.date);
    h.appendChild(date);

    var w = whenLabel(group.date, t);
    var when = document.createElement('span');
    when.className = 'day-when ' + w.cls;
    when.textContent = w.text;
    h.appendChild(when);
    sec.appendChild(h);

    group.jobs.forEach(function (i) { sec.appendChild(jobRow(i)); });
    list.appendChild(sec);
  });
}

function stepMonth(n) {
  var d = new Date(viewY, viewM + n, 1);
  viewY = d.getFullYear();
  viewM = d.getMonth();
  picked = null;
  load();
}
document.getElementById('prev-month').addEventListener('click', function () { stepMonth(-1); });
document.getElementById('next-month').addEventListener('click', function () { stepMonth(1); });
document.getElementById('this-month').addEventListener('click', function () {
  var t = todayLocal();
  viewY = t.getFullYear();
  viewM = t.getMonth();
  picked = null;
  load();
});

function load() {
  var cal = view === 'cal';
  var q = cal ? monthParams()
              : rangeParams(RANGES.filter(function (x) { return x.key === current; })[0]);
  if (!cal) document.getElementById('list').innerHTML = '<p class="empty">Loading…</p>';
  authFetch('/admin/schedule' + q).then(function (res) {
    if (!res.ok) {
      document.getElementById(cal ? 'cal' : 'list').innerHTML =
        '<p class="empty">Could not load the schedule.</p>';
      return;
    }
    LOADED = res.data.installs || [];
    if (cal) {
      document.getElementById('list').innerHTML = '';
      renderCalendar(LOADED);
    } else {
      document.getElementById('cal').innerHTML = '';
      renderList(LOADED, current === 'past');
    }
  }).catch(function () {
    document.getElementById(cal ? 'cal' : 'list').innerHTML =
      '<p class="empty">Could not reach the server.</p>';
  });
}

renderViews();
applyView();
renderRanges();
load();


/* The dot in the header. Fire-and-forget: a feed that will not load must not
   stop the page it is decorating from working. */
(function () {
  if (!window.AdminActivity) return;
  AdminActivity.load(authFetch, { limit: 80 }).then(function (r) {
    AdminNav.setCount(r.unseen);
  }).catch(function () {});
})();

AdminNav.render(document.querySelector('.h-actions'));
</script>
